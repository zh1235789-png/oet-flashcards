      { s: "共感", t: 6, jp: "これは決してあなたのせいではありません。あなたが何かをした、しなかったから起きたのではないんです。同じ立場の親御さんの支援グループをご紹介しましょうか？", en: "This is not your fault at all — nothing you did or didn't do caused this. Would it help if I put you in touch with a support group for parents in the same situation?" },
      { s: "締め", t: 0, jp: "まとめますと、フィオナちゃんの腫瘍は良性で、取り除く手術はとても安全です。退院後は、腫瘍がすべて取れたか確認するために数週間後に外来で診せていただき、必要なら理学療法や言語療法もご用意します。もしご自宅でひどい頭痛や嘔吐、ひどく眠そうな様子があれば、すぐに連れてきてください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — Fiona has a benign tumour, and the surgery to remove it is very safe. After she goes home, we'll see her in clinic in a few weeks to make sure it's all been removed, and arrange physiotherapy or speech therapy if she needs it. If she has a bad headache, vomiting or seems very drowsy at home, please bring her straight back. Do you have any other questions before we finish?" },
    ] },

  { id: "15", title: "膝骨折術後・母親", setting: "Post-operative department",
    brief: "The mother of Ali Ibrahim, who had knee surgery for a fracture from playing football, comes to see you. Attend patiently to her worries.",
    tasks: [
      "Reassure her he is doing well and explain the injury and operation (knee fracture; bones realigned).",
      "Tell her about safety gear (helmet, pads, knee braces) to prevent injuries.",
      "Explain his medication (antibiotics and painkillers for five days).",
      "If asked, advise no vigorous exercise or football until fully recovered.",
      "Offer a physiotherapy referral (knee bending/straightening, weight-bearing).",
    ],
    words: "fracture / realign / antibiotics / physiotherapist / refer / knee brace",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、アリ君の担当医の[名前]です。アリ君のお母さまですね。", en: "Hello, I'm Dr [Name], one of the doctors looking after Ali. You must be his mother." },
      { s: "問診", t: 0, jp: "今いちばん気がかりなのはどんなことですか？", en: "What's worrying you most at the moment?" },
      { s: "安心", t: 1, jp: "手術はとてもうまくいきました。アリ君は膝の骨折、つまり骨にひびや割れが入っていて、手術でずれた骨を元の位置に戻しました。", en: "I'm pleased to tell you the surgery went very well. Ali had a fracture — a break in the knee bone — and during the operation we realigned the broken parts." },
      { s: "説明", t: 3, jp: "抗菌薬は5日間すべて飲み切ることが大切です。途中でやめると感染がぶり返すことがあるからです。痛み止めも5日間です。", en: "It's really important he finishes all five days of the antibiotics, because stopping early can let an infection come back. The painkillers are also for five days.", n: "理由を言う。「飲み切って」だけで終えない。" },
      { s: "説明", t: 4, jp: "すぐにはまだです。完全に治るまでサッカーは控えてください。ただ、理学療法士が安全に復帰できるよう手伝ってくれます。", en: "Not just yet — he should avoid football until he's fully recovered, but a physiotherapist will help him get back safely.", n: "1-C：聞かれたらまず1文で答える。" },
      { s: "提案", t: 5, jp: "理学療法士をご紹介できます。膝の曲げ伸ばしや体重をかける練習など、回復を早める運動を教えてくれます。", en: "I can refer him to a physiotherapist, who'll give him exercises like bending and straightening his knee, and help him start putting weight on it.", n: "refer が refine/notify に崩れた（3バッチ連続）。" },
      { s: "提案", t: 2, jp: "復帰したら、膝パッドや膝のサポーターを着けると次のけがを防げます。", en: "When he goes back, knee pads and a knee brace will help protect him from another injury." },
      { s: "締め", t: 0, jp: "まとめますと、手術はうまくいってアリ君は順調に回復しています。していただきたいのは、抗菌薬と痛み止めを5日間きちんと飲ませることで、理学療法士にもご紹介します。2週間後に診せてください。もし膝が熱をもったり、赤く腫れたり、痛みが強くなったり、熱が出たりしたら、すぐに連れてきてください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — the operation went well and Ali is recovering nicely, and what I'd like you to do is make sure he finishes all five days of the antibiotics and painkillers, and I'll refer him to a physiotherapist. Let's review him in two weeks. If the knee becomes hot, red, swollen or more painful, or he gets a fever, please bring him straight back. Do you have any other questions before we finish?" },
    ] },

  { id: "16", title: "産後の乳房緊満", setting: "Maternity hospital",
    brief: "A first-time mother, three days after delivery, is worried about sore, engorged breasts.",
    tasks: [
      "Reassure her that engorgement is common after birth as milk comes in, temporary and manageable.",
      "Advise on breastfeeding (feed often, empty the breasts, alternate sides, massage towards the nipple, warmth before feeds).",
      "Advise on pain relief (paracetamol, aspirin or ibuprofen; lidocaine cream washed off before feeds).",
      "Reassure her she can cope well.",
      "Offer a patient-information leaflet on breastfeeding.",
    ],
    words: "engorgement / breastfeeding / nipple / ibuprofen / lidocaine / leaflet / mastitis",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。ご出産おめでとうございます。胸の張りと痛みでお困りだと伺いました。", en: "Hello, I'm Dr [Name] — and congratulations on your baby. I understand your breasts have been feeling sore and swollen." },
      { s: "問診", t: 0, jp: "いつ頃から張ってきましたか？ 赤みや熱っぽさはありますか？", en: "When did the swelling start? Have you noticed any redness, or felt feverish?" },
      { s: "安心", t: 1, jp: "これは乳房の張りといって、母乳が作られ始める出産後によく起こるものです。一時的なもので、ちゃんと対処できます。", en: "This is called breast engorgement. It's very common after giving birth, when your body starts producing milk. It's only temporary, and it can be managed." },
      { s: "提案", t: 2, jp: "授乳はこまめに行い、片方を飲ませたらもう片方も飲ませて、できるだけ空にしてください。", en: "Try to feed often, offering one side and then the other, and try to empty each breast as much as you can." },
      { s: "提案", t: 2, jp: "授乳の前に温かいタオルやシャワーで温め、胸の上から乳首に向かってマッサージすると、母乳が出やすくなります。", en: "Before a feed, a warm pack or a warm shower, and gently massaging from the top of the breast towards the nipple, will help the milk flow." },
      { s: "説明", t: 3, jp: "痛みにはパラセタモールやイブプロフェンが使えます。リドカインの塗り薬も使えますが、授乳前には洗い流してください。", en: "For the pain, you can take paracetamol or ibuprofen. A lidocaine cream can also help, but please wash it off before you feed." },
      { s: "安心", t: 4, jp: "初めてでわからないことばかりですよね。でも、とても上手にできていますよ。", en: "Everything is new for you, I know — but you're doing really well, and you will manage this." },
      { s: "提案", t: 5, jp: "母乳育児についてのパンフレットをお渡ししますね。", en: "I'll give you a leaflet about breastfeeding to take home.", n: "leaflet が \"refread\" に崩れた。紙に書く。" },
      { s: "締め", t: 0, jp: "まとめますと、出産後によくある一時的な乳房の張りです。していただきたいのは、こまめに授乳し、温めてマッサージし、痛みには痛み止めを使うことです。数日でよくなるはずなので、また明日様子を伺います。もし胸の一部が赤く熱をもつ、熱が出る、インフルエンザのような症状があれば、乳腺炎の可能性があるのですぐに知らせてください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — this is engorgement, which is very common and temporary, and what I'd like you to do is feed often, use warmth and massage, and take pain relief if you need it. It should settle in a few days, and I'll check on you again tomorrow. If part of your breast becomes red and hot, or you get a fever or flu-like symptoms, that could be mastitis, so please let us know straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "17", title: "BPPV（めまい）", setting: "City general practice",
    brief: "A 46-year-old woman has had dizziness and vomiting for two days, worse when she looks up or lies in certain positions. She thinks it is food poisoning. You diagnose BPPV.",
    tasks: [
      "Tell her the diagnosis: benign paroxysmal positional vertigo (BPPV).",
      "Explain the cause (tiny inner-ear crystals have moved, upsetting balance).",
      "Assure her it is not food poisoning.",
      "Explain the Epley manoeuvre and ask permission to refer her to a physiotherapist.",
      "Offer medication for the dizziness and vomiting.",
      "Advise that recovery time varies (days to weeks).",
    ],
    words: "benign paroxysmal positional vertigo / inner ear / crystals / Epley manoeuvre / physiotherapist / refer",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。2日前からめまいと吐き気が続いていると伺いました。", en: "Hello, I'm Dr [Name]. I understand you've had dizziness and vomiting for the past two days." },
      { s: "共感", t: 0, jp: "思うように動けないのは、本当におつらいですよね。", en: "That must be really hard, not being able to do much." },
      { s: "説明", t: 1, jp: "診察の結果、良性発作性頭位めまい症、BPPVだと思います。", en: "Having examined you, I believe you have benign paroxysmal positional vertigo — BPPV for short." },
      { s: "説明", t: 2, jp: "耳の奥にある小さな石が、本来の場所からはがれて別の場所に移ってしまい、バランスが崩れてめまいや吐き気が起きるんです。", en: "There are tiny crystals in your inner ear. They've come loose and moved to another part of the ear, which upsets your balance and causes the dizziness and vomiting." },
      { s: "安心", t: 3, jp: "食中毒ではありません。吐き気はめまいから来ているものです。", en: "This is not food poisoning — the vomiting is coming from the dizziness.", n: "1-G：否定は is not で言い切り、本当の原因を肯定文で続ける。" },
      { s: "提案", t: 4, jp: "エプリー法という頭の動かし方で、石を元の場所に戻せます。理学療法士をご紹介してもよろしいですか？", en: "The treatment is a series of head movements called the Epley manoeuvre, which moves the crystals back into place. Would it be all right if I referred you to a physiotherapist to help you with it?", n: "Epley が \"pre-maneuver\" に崩れた。紙に書く。" },
      { s: "提案", t: 5, jp: "めまいと吐き気を和らげるお薬もお出しできます。", en: "I can also give you some medication to ease the dizziness and sickness.", n: "RP17ではこの対症薬をスキップした。" },
      { s: "説明", t: 6, jp: "回復までの期間は人によって違い、数日から数週間かかります。", en: "Recovery time varies from person to person — it can take anything from a few days to a few weeks." },
      { s: "締め", t: 0, jp: "まとめますと、耳の石が原因のBPPVで、食中毒ではありません。していただきたいのは、理学療法士とエプリー法を行い、必要に応じてお薬を飲むことです。2週間後に見直しましょう。もしひどい頭痛、ものが二重に見える、ろれつが回らない、手足に力が入らないといった症状が出たら、すぐに救急を受診してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — you have BPPV, caused by crystals in your inner ear, not food poisoning, and what I'd like you to do is see the physiotherapist for the Epley manoeuvre and take the medication if you need it. Let's review this in two weeks. If you get a severe headache, double vision, slurred speech or weakness in your arms or legs, please go to the emergency department straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "18", title: "半月板術後", setting: "Hospital ward",
    brief: "A 36-year-old woman fell a week ago, dislocated her right kneecap and tore her meniscus. She had meniscus repair yesterday and is recovering on the ward, anxious about many things.",
    tasks: [
      "Ask how she is feeling after the surgery.",
      "Assure her the surgery went well and she should walk properly again.",
      "Advise keeping weight off the knee for at least six weeks.",
      "Explain that thigh muscles can waste if she doesn't exercise regularly.",
      "Offer a ward physiotherapist for strengthening exercises and walking aids.",
    ],
    words: "meniscus / patella / dislocated / weight-bearing / muscle atrophy / physiotherapist / crutches",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。昨日の手術を担当したチームの医師です。", en: "Hello, I'm Dr [Name], one of the doctors from the team that did your operation yesterday." },
      { s: "問診", t: 1, jp: "手術の後、ご気分はいかがですか？ 痛みはどうですか？", en: "How are you feeling after the surgery? How's the pain?" },
      { s: "安心", t: 2, jp: "手術はうまくいきました。また普通に歩けるようになりますよ。", en: "The surgery went well, and you should be able to walk normally again." },
      { s: "提案", t: 3, jp: "治るまで、少なくとも6週間は手術した膝に体重をかけないでください。歩くときも全体重を乗せないようにします。", en: "To let it heal, please keep your weight off that knee for at least six weeks — when you walk, don't put your full weight on it." },
      { s: "説明", t: 4, jp: "手術したのは膝ですが、運動をしないと太ももの筋肉がやせてしまいます。", en: "Even though the operation was on your knee, the muscles in your thigh can waste away if you don't exercise them regularly." },
      { s: "提案", t: 5, jp: "病棟に理学療法士を呼んで、筋力トレーニングと松葉杖の使い方を教えてもらいましょうか？", en: "Would you like me to arrange for a physiotherapist to visit you on the ward? They can show you strengthening exercises and how to use crutches." },
      { s: "締め", t: 0, jp: "まとめますと、手術はうまくいきました。していただきたいのは、6週間は膝に体重をかけず、理学療法士と筋力トレーニングを続けることです。退院前にもう一度確認し、2週間後に外来で診せてください。もし膝が熱をもって赤く腫れる、熱が出る、ふくらはぎが痛んで腫れるようなら、すぐに知らせてください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — the operation went well, and what I'd like you to do is keep your weight off the knee for six weeks and keep up the exercises with the physiotherapist. We'll check on you before you go home, and see you in clinic in two weeks. If the knee becomes hot, red or swollen, you get a fever, or your calf becomes painful and swollen, please let us know straight away. Do you have any other questions before we finish?", n: "RP18は最終質問が先に出て順序が逆転した。最終質問は必ず一番最後。" },
    ] },

  { id: "19", title: "帯状疱疹（65歳）", setting: "City general practice",
    brief: "A 65-year-old noticed a small rash on the side of the abdomen two days ago, now spreading in a belt-like band with tiny blisters. You diagnose shingles.",
    tasks: [
      "Tell the patient the diagnosis (shingles).",
      "Explain the cause (varicella-zoster, the chickenpox virus, stayed in the body and has reactivated).",
      "Explain treatment (antiviral, painkillers, topical cream).",
      "Explain that shingles itself can't be passed on, but others can catch chickenpox from it.",
      "Advise precautions (wash hands, cover the rash, avoid people who haven't had chickenpox, pregnant women, small children).",
      "If asked, explain the shingles vaccine isn't suitable while the patient has the condition.",
    ],
    words: "shingles / varicella-zoster / chickenpox / antiviral / reactivated",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。2日前からお腹の横に発疹が出たと伺いました。", en: "Hello, I'm Dr [Name]. I understand you noticed a rash on the side of your tummy two days ago." },
      { s: "問診", t: 0, jp: "発疹は痛みますか？ 発疹が出る前に、ピリピリした感じはありましたか？", en: "Is the rash painful? Did you notice any tingling or burning before it appeared?" },
      { s: "説明", t: 1, jp: "診察したところ、帯状疱疹です。", en: "Having examined you, this is shingles.", n: "shingles が \"singles\" に崩れた。紙に書く。" },
      { s: "説明", t: 2, jp: "水ぼうそうと同じ水痘・帯状疱疹ウイルスが原因です。昔かかった水ぼうそうのウイルスが体に残っていて、それが再び活動を始めたんです。", en: "It's caused by the varicella-zoster virus — the same virus that causes chickenpox. After you had chickenpox, the virus stayed in your body, and now it's become active again.", n: "varicella が \"Viral\" に崩れた。" },
      { s: "提案", t: 3, jp: "治療は、抗ウイルス薬と痛み止め、それに塗り薬です。", en: "The treatment is an antiviral medicine, painkillers and a cream for the rash." },
      { s: "説明", t: 4, jp: "帯状疱疹そのものは人にうつりません。ただ、水ぼうそうにかかったことのない人には、水ぼうそうとしてうつることがあります。", en: "You can't pass shingles on to someone else. But someone who has never had chickenpox can catch chickenpox from you." },
      { s: "提案", t: 5, jp: "こまめに手を洗い、発疹は覆っておいてください。水ぼうそうにかかったことのない人、妊婦さん、小さなお子さんとの接触は避けてください。", en: "So please wash your hands often and keep the rash covered, and avoid contact with anyone who hasn't had chickenpox, pregnant women and young children." },
      { s: "説明", t: 6, jp: "帯状疱疹のワクチンは、今かかっている方には適していません。治ってから改めてご相談しましょう。", en: "The shingles vaccine isn't suitable while you have the condition — we can talk about it again once you've recovered." },
      { s: "締め", t: 0, jp: "まとめますと、帯状疱疹です。していただきたいのは、抗ウイルス薬を飲み切り、発疹を覆って、妊婦さんや小さなお子さんとの接触を避けることです。1週間後に見直しましょう。もし発疹が顔や目の近くに広がる、痛みが抑えられない、熱が高いときは、すぐに受診してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — you have shingles, and what I'd like you to do is finish the antiviral tablets, keep the rash covered, and stay away from pregnant women and young children. Let's review this in a week. If the rash spreads to your face or near your eye, the pain isn't controlled, or you get a high fever, please come back straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "20", title: "守秘義務・夫", setting: "Outside a hospital ward",
    brief: "Your 29-year-old patient has hepatitis B and is resting on the ward. She has told you her husband is upset and wants a divorce. Today he asks to speak to you privately, out of her hearing.",
    tasks: [
      "Express concern about discussing her condition without her present.",
      "Decline to disclose medical information without her consent.",
      "Explain the ethical duty of doctor–patient confidentiality.",
      "Advise him to let you ask her permission before you disclose anything.",
      "Assure him the hospital is doing all it can for her.",
    ],
    words: "confidentiality / consent / disclose / ethical code / permission",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、奥さまの担当医の[名前]です。私にお話があると伺いました。", en: "Hello, I'm Dr [Name], the doctor looking after your wife. I understand you wanted to speak to me." },
      { s: "問診", t: 0, jp: "今日はどんなことが気がかりでいらっしゃいますか？", en: "What's on your mind today?" },
      { s: "説明", t: 1, jp: "奥さまのいないところで病状のお話をするのは、少し心配です。", en: "I have to say I'm a little concerned about discussing your wife's condition without her being here." },
      { s: "説明", t: 2, jp: "申し訳ありませんが、奥さまの同意なしに病状についてお話しすることはできません。", en: "I'm sorry, but I'm not able to share any information about her condition without her consent.", n: "1-B：拒否→理由→代替案。RP20はこの型で20本初の紛争解決エンディング。" },
      { s: "説明", t: 3, jp: "医師には、患者さんの秘密を守るという倫理上の決まりがあるからです。ご家族であっても同じです。", en: "That's because doctors have to follow a strict code of patient confidentiality — and that applies to family too." },
      { s: "共感", t: 0, jp: "ご心配なお気持ちはよくわかります。ご家族として知りたいのは当然です。", en: "I can see how worried you are, and it's natural to want to know as her husband." },
      { s: "提案", t: 4, jp: "よろしければ、私から奥さまに、ご主人にお話ししてよいか確認してみましょうか？", en: "What I can do is ask your wife if she's happy for me to talk to you. Would that be all right?" },
      { s: "安心", t: 5, jp: "病院としても、奥さまのためにできることはすべて行っていますので、ご安心ください。", en: "I can assure you that we're doing everything we can for your wife." },
      { s: "締め", t: 0, jp: "まとめますと、奥さまの同意がないまま病状をお話しすることはできませんが、私から奥さまにお話ししてよいか確認します。今日中に確認して、改めてお声がけします。もしその前に心配なことがあれば、病棟の看護師にいつでもおっしゃってください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — I can't discuss your wife's condition without her consent, but what I'll do is ask her whether she's happy for me to speak with you. I'll do that today and come back to you. If anything worries you before then, please speak to the nurses on the ward at any time. Do you have any other questions before we finish?", n: "医学的な safety net が無いカード。「その前に心配があれば看護師へ」で4パーツ目を埋める。" },
    ] },

  { id: "21", title: "薬Zの回収", setting: "GP clinic",
    brief: "A 62-year-old regular patient has taken Drug Z for high blood pressure for seven years. Drug Z has just been recalled over a suspected cancer risk. Inform the patient and explain the change of medication.",
    tasks: [
      "Ask about the patient's general health recently.",
      "Inform the patient about the recall of Drug Z.",
      "Explain you will switch to a new blood pressure drug.",
      "Reassure that the new drug is not suspected of side effects such as cancer.",
      "If asked, advise that relying only on natural remedies is dangerous at their age.",
      "Explain you need to monitor the response to the new drug.",
      "Schedule a follow-up appointment.",
    ],
    words: "recall / Drug Z / blood pressure / side effects / natural remedies / monitor / follow-up",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。お越しいただきありがとうございます。今日は大切なお話があります。", en: "Hello, I'm Dr [Name]. Thank you for coming in — there's something important I need to talk to you about today." },
      { s: "問診", t: 1, jp: "まず、最近の体調はいかがですか？", en: "First of all, how has your health been lately?" },
      { s: "説明", t: 2, jp: "7年間飲んでいただいている血圧の薬、薬Zが、がんを起こす疑いがあるとして、保健当局から回収されることになりました。", en: "The blood pressure medicine you've been taking for seven years, Drug Z, has been recalled by the health authorities, because there are concerns it may cause cancer.", n: "Drug Z が \"drug C/D\" に崩れた。紙に書く。" },
      { s: "共感", t: 0, jp: "長い間飲んできた薬なので、驚かれたし、ご心配ですよね。", en: "I can see this is a shock, especially after taking it for so long — it's completely understandable to be worried.", n: "RP21は怒りを一度も承認せず統計説明のみだった。" },
      { s: "提案", t: 3, jp: "そこで、新しい血圧の薬に切り替えたいと思います。", en: "So I'd like to switch you to a new medicine for your blood pressure." },
      { s: "安心", t: 4, jp: "新しい薬には、がんのような副作用の疑いはありません。", en: "The new medicine is not suspected of causing any side effects like cancer." },
      { s: "説明", t: 5, jp: "残念ですが、お年を考えると自然療法だけに頼るのは危険です。血圧が高いままだと、脳卒中や心臓発作の危険があるからです。", en: "I'm afraid relying only on natural remedies would be dangerous at your age, because high blood pressure can lead to a stroke or heart attack.", n: "1-B：断るときは理由をつける。" },
      { s: "説明", t: 6, jp: "新しい薬が体に合っているか、しばらく血圧を確認させてください。", en: "I'll need to keep an eye on how your blood pressure responds to the new medicine." },
      { s: "締め", t: 7, jp: "まとめますと、薬Zは回収されたので、新しい血圧の薬に切り替えます。していただきたいのは、今日から新しい薬を毎日飲むことです。2週間後に血圧を確認しましょう。もしひどい頭痛、めまい、胸の痛み、息苦しさがあれば、すぐに受診してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — Drug Z has been recalled, so we're switching you to a new blood pressure medicine, and what I'd like you to do is take it every day starting today. Let's check your blood pressure in two weeks. If you get a severe headache, dizziness, chest pain or shortness of breath, please come in straight away. Do you have any other questions before we finish?", n: "Task7（フォロー予約）がそのまま期間パーツ。" },
    ] },

  { id: "22", title: "高コレステロール", setting: "Suburban general practice",
    brief: "A 42-year-old regular patient has come for blood test results. His lipid levels have risen sharply since a year ago, putting him at high risk. You recommend medication to reduce his future risk of a heart attack.",
    tasks: [
      "Ask about his general health and tell him the results.",
      "Ask whether there have been any major changes in his life recently.",
      "Suggest starting medication such as Lipitor or Crestor.",
      "Explain the benefits of the medication.",
      "Assure him the condition is manageable.",
      "Discuss the risks of not taking medication.",
    ],
    words: "cholesterol / triglycerides / LDL / Lipitor / Crestor / heart attack / stroke",
    steps: [
      { s: "導入", t: 1, jp: "こんにちは、[名前]です。今日は血液検査の結果をお伝えしますね。その前に、最近の体調はいかがですか？", en: "Hello, I'm Dr [Name]. I've got your blood test results today — but first, how have you been feeling lately?" },
      { s: "説明", t: 1, jp: "中性脂肪とコレステロールの値が高く、1年前の検査から大きく上がっています。そのため、心臓発作のリスクが高いグループに入ります。", en: "Your results show that your triglycerides and cholesterol levels are high — a big rise since your test a year ago. That puts you in the high-risk group for a heart attack." },
      { s: "問診", t: 2, jp: "この1年で、生活に何か大きな変化はありましたか？", en: "Have there been any major changes in your life over the past year?" },
      { s: "共感", t: 2, jp: "奥さまを亡くされたなんて、本当におつらかったですね。お話しくださってありがとうございます。", en: "I'm so sorry to hear about your wife — that must have been incredibly hard. Thank you for telling me.", n: "1-E（死別）。RP22は妻の死の開示に \"…for your blood cholesterol level\" と検査値で返した。感情には感情で返す。" },
      { s: "提案", t: 3, jp: "コレステロールを下げるために、リピトールやクレストールといったお薬を始めることをお勧めします。", en: "I'd recommend starting a medicine to lower your cholesterol, such as Lipitor or Crestor." },
      { s: "説明", t: 4, jp: "お薬でコレステロールが下がれば、将来の心臓発作や脳卒中のリスクを減らせます。", en: "Bringing your cholesterol down with medication will reduce your risk of a heart attack or stroke in the future." },
      { s: "安心", t: 5, jp: "これは十分に管理できる状態ですので、ご安心ください。", en: "The good news is that this is a very manageable condition." },
      { s: "説明", t: 6, jp: "薬を飲まないと、血管に脂肪がたまり続けて、心臓発作や脳卒中を起こす危険が高くなります。", en: "Without treatment, fat can keep building up in your blood vessels, which raises the risk of a heart attack or stroke." },
      { s: "説明", t: 6, jp: "食事と運動はとても大切なので、ぜひ続けてください。ただ、今の値はかなり高いので、それだけでは十分に下がりません。お薬と組み合わせるのが一番安全です。", en: "Diet and exercise are really important, so please do keep them up. But your levels are quite high now, so on their own they won't bring them down enough — the safest approach is to combine them with medication.", n: "患者は「薬なしで食事と運動で」と必ず聞く設定。1-C：まず答える＋1-B：理由をつける。" },
      { s: "締め", t: 0, jp: "まとめますと、コレステロールが高く、心臓発作のリスクが上がっています。していただきたいのは、リピトールを毎日飲み始めることです。3か月後に血液検査をして見直しましょう。もし胸の痛みや締めつけ、急な息苦しさがあれば、すぐに救急車を呼んでください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — your cholesterol is high, which raises your risk of a heart attack, and what I'd like you to do is start taking Lipitor every day. Let's repeat your blood test and review this in three months. If you ever get chest pain or tightness, or sudden breathlessness, please call an ambulance straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "23", title: "1型糖尿病・母親", setting: "City centre general practice",
    brief: "A 12-year-old boy was recently diagnosed with type 1 diabetes. His anxious mother doesn't understand how a child can get diabetes and wants help handling it.",
    tasks: [
      "Explain how type 1 differs from type 2 diabetes.",
      "Assure her the condition is manageable.",
      "Advise on the importance of insulin injections.",
      "Explain that insulin can cause hypoglycaemia.",
      "Advise her to watch for signs of hypoglycaemia (dizziness, fatigue, confusion).",
      "Suggest what to do if she suspects a hypo.",
      "Reassure her that her son can lead a normal life.",
    ],
    words: "type 1 diabetes / pancreas / insulin / hypoglycaemia / glucose tablets",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。息子さんが1型糖尿病と診断されたと伺いました。", en: "Hello, I'm Dr [Name]. I understand your son has recently been diagnosed with type 1 diabetes." },
      { s: "共感", t: 0, jp: "突然のことで、さぞご不安でしょう。わからないことは何でも聞いてください。", en: "This must have come as a real shock, and it's completely understandable to feel anxious. Please ask me anything.", n: "RP23は不安な母に \"There is a lot of risk of taking insulin.\" で切断した。" },
      { s: "説明", t: 1, jp: "1型糖尿病は、すい臓がインスリンをほとんど作れなくなる病気で、子どもにも起こります。生活習慣と関係する2型とは違い、何かをしたせいではありません。", en: "Type 1 diabetes is when the pancreas stops making insulin, and it can happen at any age, including in children. Unlike type 2, which is linked to lifestyle, it's not caused by anything he or you did." },
      { s: "安心", t: 2, jp: "十分に管理できる病気です。", en: "It's a condition that can be very well managed." },
      { s: "説明", t: 3, jp: "体がインスリンを作れないので、毎日のインスリン注射が欠かせません。", en: "Because his body can't make insulin, daily insulin injections are essential." },
      { s: "説明", t: 4, jp: "ただ、インスリンが効きすぎると、血糖が下がりすぎる低血糖になることがあります。", en: "One thing to be aware of is that insulin can sometimes make his blood sugar drop too low — this is called hypoglycaemia." },
      { s: "説明", t: 5, jp: "めまい、ひどい疲れ、混乱、震えや冷や汗が低血糖のサインです。", en: "The signs to look out for are dizziness, tiredness, confusion, shakiness and sweating." },
      { s: "提案", t: 6, jp: "低血糖かなと思ったら、すぐにジュースやブドウ糖など甘いものをとらせてください。15分しても良くならない、または意識がはっきりしないときは、救急車を呼んでください。", en: "If you think he's having a hypo, give him something sugary straight away, like juice or glucose tablets. If he doesn't improve within fifteen minutes, or he becomes drowsy or confused, call an ambulance.", n: "⚠️ RP23で糖分投与を飛ばして搬送指示した（臨床的誤り）。まず糖分→改善しなければ救急。" },
      { s: "安心", t: 7, jp: "きちんと管理すれば、息子さんは学校も運動も、普通の生活を送れますよ。", en: "With good management, your son can lead a completely normal life — school, sport, everything." },
      { s: "締め", t: 0, jp: "まとめますと、息子さんは1型糖尿病で、毎日のインスリンが必要ですが、十分に管理できます。していただきたいのは、毎日インスリンを打ち、低血糖のサインに気をつけることです。来週、糖尿病の看護師と一緒にもう一度確認しましょう。もし甘いものをとっても良くならない、意識がもうろうとするときは、すぐに救急車を呼んでください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — your son has type 1 diabetes, which needs daily insulin but can be very well managed, and what I'd like you to do is give his insulin every day and watch for the signs of a hypo. Let's go over everything again next week with the diabetes nurse. If he doesn't improve after having something sugary, or he becomes drowsy or confused, call an ambulance straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "24", title: "咳止めの要求を断る", setting: "City centre general practice",
    brief: "A 21-year-old student with no signs of a cough asks for cough medicine, insisting they cough badly at night. Examination finds nothing. Another doctor has already refused. This is your first time seeing them.",
    tasks: [
      "Ask about the cough and past medical history.",
      "Decline to prescribe the cough medicine.",
      "Explain the risk of dependence.",
      "Tell them to return if symptoms persist.",
      "Explain the signs of dependence (withdrawal: dizziness, stomach pains, hot sweats, shivers).",
      "Advise them to come back for help if they think they have these symptoms.",
    ],
    words: "cough medicine / prescribe / dependence / withdrawal / hot sweats / shivers",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。今日はどうされましたか？", en: "Hello, I'm Dr [Name]. What can I do for you today?" },
      { s: "問診", t: 1, jp: "その咳について教えてください。いつからですか？ 痰は出ますか？ 夜だけですか？", en: "Tell me about the cough — when did it start, are you bringing anything up, and is it only at night?" },
      { s: "問診", t: 1, jp: "これまでに大きな病気をしたことや、定期的に飲んでいる薬はありますか？", en: "Have you had any medical problems in the past, or do you take any regular medication?" },
      { s: "説明", t: 2, jp: "申し訳ありませんが、今日は咳止めをお出しできません。診察で咳の原因になるものが見つからないからです。", en: "I'm sorry, but I'm not able to prescribe cough medicine today, because I couldn't find anything on examination that's causing a cough.", n: "1-B：拒否→理由。RP24はこの型が全編機能し、6タスク完全消化。" },
      { s: "説明", t: 3, jp: "咳止めの中には、必要がないのに飲むと依存してしまうものがあります。", en: "Some cough medicines can be habit-forming if they're taken when they're not needed." },
      { s: "提案", t: 4, jp: "もし咳が続くようなら、また受診してください。そのときにもう一度診察します。", en: "If the cough carries on, please come back and I'll examine you again." },
      { s: "説明", t: 5, jp: "依存のサインとしては、薬をやめたときのめまい、腹痛、ほてりや寒気などがあります。", en: "The signs of dependence include withdrawal symptoms when you stop — like dizziness, stomach pains, hot sweats and shivers." },
      { s: "提案", t: 6, jp: "もしそのような症状に心当たりがあれば、遠慮なくまた相談に来てください。お力になります。", en: "If you think you might have any of those symptoms, please come back and talk to me — I'm here to help, not to judge." },
      { s: "締め", t: 0, jp: "まとめますと、今日の診察では咳の原因が見つからなかったので、咳止めはお出ししません。していただきたいのは、咳がいつ出るか記録しておくことです。2週間たっても続くようなら、また来てください。もし薬をやめたときにめまい、腹痛、汗や震えが出るようなら、すぐにご相談ください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — I couldn't find a cause for a cough today, so I won't be prescribing cough medicine, and what I'd like you to do is keep a note of when the cough happens. If it's still there in two weeks, please come back and see me. And if you notice dizziness, stomach pains, sweats or shivers when you stop taking a medicine, please come and talk to me straight away. Do you have any other questions before we finish?", n: "RP24で safety net が24本ぶりに初発動した。" },
    ] },
];

const LS_KEY = "oet_flashcards_v1";

// Safariプライベートブラウズ・data: URL 等では localStorage へのアクセス自体が
// 例外を投げる。素で触ると初期化がそこで止まり、カテゴリ選択が空・カード0枚になる。
// 読み書きを潰しても「進捗が保存されないだけ」で学習はできるので、例外を飲む。
const store = {
  available: true,
  get(k) { try { return localStorage.getItem(k); } catch (e) { this.available = false; return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.available = false; } },
};
let state = {
  category: "all",
  rp: null,    // ロールプレイ中のカード番号（"05"など）。null＝通常のフレーズ練習
  reviewMode: false,
  order: [],
  index: 0,
  flipped: false,
  known: {},   // cardKey -> true
  review: {},  // cardKey -> true
  ts: {},      // cardKey -> 最後に印を付けた時刻（端末間同期のマージに使う）
  resetAt: 0,  // リセットした時刻。これより古い印は同期時に捨てる
};

function cardKey(c) { return c.cat + "::" + c.jp; }

function loadState() {
  try {
    const saved = JSON.parse(store.get(LS_KEY));
    if (saved) {
      state.known = saved.known || {}; state.review = saved.review || {};
      state.ts = saved.ts || {}; state.resetAt = saved.resetAt || 0;
      // 同期を入れる前に付けた印には時刻が無い。1回だけ現在時刻を入れて土俵に載せる。
      for (const k of [...Object.keys(state.known), ...Object.keys(state.review)]) {
        if (!state.ts[k]) state.ts[k] = Date.now();
      }
    }
  } catch (e) {}
}
function saveState() {
  store.set(LS_KEY, JSON.stringify({ known: state.known, review: state.review, ts: state.ts, resetAt: state.resetAt }));
}

// ============ 端末間同期（GitHubの非公開Gist） ============
// iPhoneとiPadで同じ進捗を見るための同期。サーバーを持たずに済ませるため、
// ユーザー自身のGist 1ファイルを共有メモ代わりに使う。
const SYNC_KEY = "oet_flashcards_sync", GIST_FILE = "oet-flashcards.json",
      GIST_DESC = "OET Speaking flashcards sync (auto)";
let SY = (() => { try { return JSON.parse(store.get(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
function saveSY() { store.set(SYNC_KEY, JSON.stringify(SY)); }
let syncing = false, syncAgain = false, syncTimer = null;

async function gh(path, opts = {}) {
  const res = await fetch("https://api.github.com" + path, Object.assign({ cache: "no-store" }, opts, {
    headers: { "Authorization": "Bearer " + SY.token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
  }));
  if (!res.ok) throw new Error(
    res.status === 401 ? "トークンが無効か期限切れです"
    : (res.status === 403 || res.status === 404) ? "トークンにgist権限がありません（" + res.status + "）"
    : "GitHubエラー " + res.status);
  return res.status === 204 ? null : res.json();
}
function syncDoc() {
  return { v: 1, resetAt: state.resetAt || 0, known: state.known, review: state.review, ts: state.ts };
}
// カード単位で「印を付けた時刻が新しい方」を採用する。
// 同じカードを両方の端末で触っても、あとから触った方が残る。
function mergeRemote(R) {
  if (!R || (!R.known && !R.review)) return;
  const resetAt = Math.max(state.resetAt || 0, R.resetAt || 0);
  const mine = { known: state.known, review: state.review, ts: state.ts };
  const theirs = { known: R.known || {}, review: R.review || {}, ts: R.ts || {} };
  const known = {}, review = {}, ts = {};
  for (const k of new Set([...Object.keys(mine.ts), ...Object.keys(theirs.ts)])) {
    const mt = mine.ts[k] || 0, tt = theirs.ts[k] || 0;
    const src = tt > mt ? theirs : mine, t = Math.max(mt, tt);
    if (t < resetAt) continue;            // リセットより前の印は捨てる
    if (src.known[k]) known[k] = true;
    else if (src.review[k]) review[k] = true;
    else continue;                        // 印が外れた状態が最新なら残さない
    ts[k] = t;
  }
  state.known = known; state.review = review; state.ts = ts; state.resetAt = resetAt;
}
async function syncNow() {
  if (!SY.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; SY.state = "syncing"; renderSync();
  try {
    if (!SY.gistId) {
      const list = await gh("/gists?per_page=100");
      const g = list.find(x => x.files && x.files[GIST_FILE]);
      SY.gistId = g ? g.id : (await gh("/gists", { method: "POST", body: JSON.stringify({
        description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(syncDoc()) } } }) })).id;
    }
    const g = await gh("/gists/" + SY.gistId);
    const f = g.files[GIST_FILE];
    let remoteText = f ? f.content : "";
    if (f && f.truncated) remoteText = await (await fetch(f.raw_url, { cache: "no-store" })).text();
    let remote = null; try { remote = JSON.parse(remoteText); } catch (e) {}
    mergeRemote(remote); saveState();
    const mineText = JSON.stringify(syncDoc());
    if (mineText !== remoteText) await gh("/gists/" + SY.gistId, { method: "PATCH",
      body: JSON.stringify({ files: { [GIST_FILE]: { content: mineText } } }) });
    SY.last = Date.now(); SY.state = "ok"; SY.err = "";
  } catch (e) {
    SY.state = "err";
    SY.err = (typeof navigator !== "undefined" && navigator.onLine === false)
      ? "オフライン（次にネットにつながったとき同期します）" : e.message;
  }
  saveSY(); syncing = false;
  renderSync(); render();
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function syncSoon() { if (!SY.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2000); }
function syncText() {
  if (!SY.token) return "";
  if (SY.state === "syncing") return "☁️ 同期中…";
  if (SY.state === "err") return "⚠️ 同期エラー：" + SY.err;
  if (SY.last) {
    const d = new Date(SY.last);
    return `☁️ 同期済み ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  return "☁️ 同期待ち";
}

function filteredCards() {
  let cards = CARDS.map((c, i) => ({ ...c, _i: i }));
  if (state.category !== "all") cards = cards.filter(c => c.cat === state.category);
  if (state.reviewMode) cards = cards.filter(c => state.review[cardKey(c)]);
  return cards;
}

// ---- 🎭 ロールプレイ ----
// 画面の並び: 0＝ロールカード、1..N＝セリフ（会話の順）、N+1＝通し確認。
// 流れを覚えるのが目的なので、シャッフル・要復習の絞り込みはかけない。
function currentRP() { return state.rp ? ROLEPLAYS.find(r => r.id === state.rp) || null : null; }
function rpTasks(step) { return [].concat(step.t || []).filter(Boolean); }
function rpCard(rp, k) {
  const st = rp.steps[k];
  return { cat: "🎭Card" + rp.id, jp: st.jp, en: st.en, note: st.n || "", s: st.s, t: st.t };
}

function rebuildOrder(shuffle = false) {
  const rp = currentRP();
  if (rp) {
    state.order = Array.from({ length: rp.steps.length + 2 }, (_, i) => i);
    state.index = 0; state.flipped = false;
    return;
  }
  const cards = filteredCards();
  state.order = cards.map(c => c._i);
  if (shuffle) {
    for (let i = state.order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
    }
  }
  state.index = 0;
  state.flipped = false;
}

function currentCard() {
  if (state.order.length === 0) return null;
  const rp = currentRP();
  if (rp) {
    const k = state.index - 1;   // ロールカード・通し画面ではセリフなし
    return k >= 0 && k < rp.steps.length ? rpCard(rp, k) : null;
  }
  return CARDS[state.order[state.index]];
}

// --- 音声管理: 自然な音声を優先的に選ぶ ---
let voices = [];
let selectedVoiceURI = store.get("oet_voice") || "";

// 自然さの目安スコア。Google音声・macOSの拡張(Enhanced)/プレミアム音声を上位に。
function voiceScore(v) {
  let s = 0;
  const n = v.name.toLowerCase();
  if (!v.lang.startsWith("en")) return -100;
  if (n.includes("premium")) s += 50;
  if (n.includes("enhanced") || n.includes("拡張")) s += 40;
  if (n.includes("google")) s += 35;
  if (n.includes("natural") || n.includes("online")) s += 30;
  if (/samantha|serena|stephanie|daniel|karen|moira|kate|oliver|ava|zoe|allison/.test(n)) s += 10;
  if (v.lang === "en-GB") s += 8;        // OETは英豪系の英語が中心
  else if (v.lang === "en-AU") s += 6;
  else if (v.lang === "en-US") s += 4;
  if (n.includes("compact") || n.includes("eloquence")) s -= 50; // 機械的な軽量音声を除外
  return s;
}

function populateVoices() {
  const sel = document.getElementById("voiceSelect");
  if (!window.speechSynthesis) { sel.innerHTML = "<option>音声非対応</option>"; return; }
  voices = speechSynthesis.getVoices()
    .filter(v => v.lang.startsWith("en"))
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  if (!voices.length) { sel.innerHTML = "<option>音声なし</option>"; return; }
  sel.innerHTML = voices.map(v =>
    `<option value="${v.voiceURI}">🔊 ${v.name} (${v.lang})</option>`).join("");
  // 保存済みの選択があればそれを、なければ最高スコアの音声を選ぶ
  if (selectedVoiceURI && voices.some(v => v.voiceURI === selectedVoiceURI)) {
    sel.value = selectedVoiceURI;
  } else {
    selectedVoiceURI = voices[0].voiceURI;
    sel.value = selectedVoiceURI;
  }
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.voiceURI === selectedVoiceURI);
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-GB"; }
  u.rate = parseFloat(document.getElementById("rateSelect").value);
  u.pitch = 1.0;
  speechSynthesis.speak(u);
}

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

// 通し画面の「通しで聞く」。1文ずつ順に読み上げ、読んでいる行を光らせる。
let scriptRun = 0;
function speakScript(lines, onLine) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const run = ++scriptRun;
  const v = voices.find(x => x.voiceURI === selectedVoiceURI);
  const rate = parseFloat(document.getElementById("rateSelect").value);
  const say = (i) => {
    if (run !== scriptRun) return;
    onLine(i);
    if (i >= lines.length) return;
    const u = new SpeechSynthesisUtterance(lines[i]);
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-GB"; }
    u.rate = rate;
    u.onend = () => setTimeout(() => say(i + 1), 450);
    speechSynthesis.speak(u);
  };
  say(0);
}
function stopScript() { scriptRun++; if (window.speechSynthesis) speechSynthesis.cancel(); }

function renderFlow(rp) {
  const rail = document.getElementById("flowRail");
  if (!rp) { rail.hidden = true; rail.innerHTML = ""; return; }
  rail.hidden = false;
  const items = [{ cls: "st-card", label: "📋 カード" }]
    .concat(rp.steps.map((st, k) => ({ cls: "st-" + st.s, label: `${k + 1} ${st.s}` })))
    .concat([{ cls: "st-all", label: "📜 通し" }]);
  rail.innerHTML = items.map((it, i) =>
    `<button class="${it.cls}${i === state.index ? " now" : i < state.index ? " done" : ""}" data-i="${i}">${it.label}</button>`).join("");
  rail.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    stopScript(); state.index = +b.dataset.i; state.flipped = false; render();
  }));
  const now = rail.querySelector(".now");
  if (now && now.scrollIntoView) now.scrollIntoView({ block: "nearest", inline: "center" });
}

function renderRP(rp) {
  const area = document.getElementById("cardArea");
  const N = rp.steps.length, i = state.index;
  renderFlow(rp);
  document.getElementById("cardCounter").textContent =
    i === 0 ? `Card${rp.id} ロールカード` : i > N ? `Card${rp.id} 通し確認` : `セリフ ${i} / ${N}`;
  document.getElementById("progressFill").style.width = `${(i / (N + 1)) * 100}%`;
  const rpDone = rp.steps.filter((st, k) => state.known[cardKey(rpCard(rp, k))]).length;
  document.getElementById("statsText").innerHTML =
    `<span class="known">✓ ${rpDone} / ${N}</span>　<span class="review">⭐ 要復習 ${rp.steps.filter((st, k) => state.review[cardKey(rpCard(rp, k))]).length}</span>`;
  const flowline = rp.steps.map(st => st.s).filter((s, k, a) => s !== a[k - 1])
    .map(s => `<span class="chip st-${s}">${s}</span>`).join(" → ");

  if (i === 0) {
    area.innerHTML = `<div class="rp-panel">
      <div class="rp-head"><b>ROLE PLAY CARD — DOCTOR</b><span>Card${rp.id}・${esc(rp.title)}</span></div>
      <dl class="rp-row"><dt>SETTING</dt><dd>${esc(rp.setting)}</dd></dl>
      <dl class="rp-row"><dt>DOCTOR</dt><dd>${esc(rp.brief)}</dd></dl>
      <dl class="rp-row"><dt>TASK</dt><dd><ol>${rp.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ol></dd></dl>
      <p class="rp-words">✏️ 紙に書く：${esc(rp.words)}</p>
      <p style="font-size:0.78rem;color:var(--text-sub)">会話の流れ（${N}セリフ）</p>
      <div class="rp-flowline">${flowline}</div>
      <div class="rp-actions"><button class="btn primary" id="rpStart">▶ 流れの順に始める</button>
        <button class="btn" id="rpToAll">📜 通しで見る</button></div>
    </div>`;
    document.getElementById("rpStart").addEventListener("click", next);
    document.getElementById("rpToAll").addEventListener("click", () => { state.index = N + 1; render(); });
    return;
  }

  if (i > N) {
    area.innerHTML = `<div class="rp-panel">
      <div class="rp-head"><b>📜 通しで確認</b><span>Card${rp.id}・${esc(rp.title)}</span></div>
      <p style="font-size:0.8rem;color:var(--text-sub);margin-bottom:8px">5分の流れを頭から最後まで。和文を隠して言えるか確認しよう。</p>
      <ol class="rp-script" id="rpScript">${rp.steps.map((st, k) => `
        <li data-k="${k}"><span class="chip st-${st.s}">${st.s}</span>
          <div><div class="en">${esc(st.en)}</div><div class="jp">${esc(st.jp)}</div></div></li>`).join("")}
      </ol>
      <div class="rp-actions" style="margin-top:14px">
        <button class="btn primary" id="rpPlayAll">🔊 通しで聞く</button>
        <button class="btn" id="rpStop">■ 止める</button>
        <button class="btn" id="rpHideJp">和文を隠す</button>
        <button class="btn" id="rpRestart">↺ カードから</button>
      </div>
    </div>`;
    const list = document.getElementById("rpScript");
    const mark = (k) => list.querySelectorAll("li").forEach(li => {
      const on = +li.dataset.k === k;
      li.classList.toggle("speaking", on);
      if (on && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
    });
    document.getElementById("rpPlayAll").addEventListener("click", () => speakScript(rp.steps.map(st => st.en), mark));
    document.getElementById("rpStop").addEventListener("click", () => { stopScript(); mark(-1); });
    document.getElementById("rpHideJp").addEventListener("click", (e) => {
      const hid = list.classList.toggle("hide-jp");
      e.target.textContent = hid ? "和文を表示" : "和文を隠す";
    });
    document.getElementById("rpRestart").addEventListener("click", () => { stopScript(); state.index = 0; render(); });
    return;
  }

  const k = i - 1, st = rp.steps[k], card = rpCard(rp, k);
  const tasks = rpTasks(st);
  const taskRef = tasks.length
    ? tasks.map(n => `<b>Task ${n}</b>　${esc(rp.tasks[n - 1])}`).join("<br>")
    : (st.s === "締め" ? "<b>締め4パーツ</b>　要約 → 行動 → 期間＋safety net → 最終質問" : "<b>カード外</b>　流れをつくる定型");
  const prev = k > 0 ? `<p class="prev-line">↑ 直前：${esc(rp.steps[k - 1].en)}</p>` : "";
  const backAlign = (card.en.length > 90 || card.note) ? " align-left" : "";
  area.innerHTML = `
    <div class="card ${state.flipped ? "flipped" : ""}" id="theCard">
      <div class="card-face card-front align-left st-${st.s}">
        <span class="stage-tag">${k + 1}. ${st.s}</span>
        <span class="face-label">Card${rp.id}</span>
        <div class="task-ref">${taskRef}</div>
        ${prev}
        <p class="jp-text">${esc(st.jp)}</p>
        <p class="hint">クリック or Space で答えを表示</p>
      </div>
      <div class="card-face card-back${backAlign} st-${st.s}">
        <span class="stage-tag">${k + 1}. ${st.s}</span>
        <span class="face-label">ANSWER</span>
        <p class="en-text">${esc(st.en)}</p>
        ${st.n ? `<p class="note">💡 ${esc(st.n)}</p>` : ""}
        <button class="speak-btn" id="speakBtn">🔊 発音を聞く</button>
      </div>
    </div>`;
  document.getElementById("theCard").addEventListener("click", (e) => {
    if (e.target.id === "speakBtn") return;
    flip();
  });
  document.getElementById("speakBtn").addEventListener("click", (e) => { e.stopPropagation(); speak(st.en); });
}

function render() {
  const rp = currentRP();
  document.getElementById("shuffleBtn").disabled = !!rp;
  document.getElementById("reviewModeBtn").disabled = !!rp;
  if (rp) { renderRP(rp); return; }
  renderFlow(null);
  const area = document.getElementById("cardArea");
  const card = currentCard();
  const total = state.order.length;

  document.getElementById("cardCounter").textContent = total ? `${state.index + 1} / ${total}` : "0 / 0";
  document.getElementById("progressFill").style.width = total ? `${((state.index + 1) / total) * 100}%` : "0%";

  const knownCount = Object.keys(state.known).length;
  const reviewCount = Object.keys(state.review).length;
  document.getElementById("statsText").innerHTML =
    `<span class="known">✓ ${knownCount}</span>　<span class="review">⭐ 要復習 ${reviewCount}</span>`;

  if (!card) {
    area.innerHTML = `<div class="done-msg">
      <h2>カードがありません</h2>
      <p>${state.reviewMode ? "要復習のカードはありません。よく頑張りました！🎉" : "カテゴリを変更してください。"}</p>
    </div>`;
    return;
  }

  const en = card.en.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const jp = card.jp.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // 長い文は中央揃えだと行頭がばらついて読みにくいので左揃えに切り替える
  const frontAlign = card.jp.length > 45 ? " align-left" : "";
  const backAlign = (card.en.length > 90 || card.note) ? " align-left" : "";
  area.innerHTML = `
    <div class="card ${state.flipped ? "flipped" : ""}" id="theCard">
      <div class="card-face card-front${frontAlign}">
        <span class="category-tag">${card.cat}</span>
        <span class="face-label">日本語 → 英語で言ってみよう</span>
        <p class="jp-text">${jp}</p>
        <p class="hint">クリック or Space で答えを表示</p>
      </div>
      <div class="card-face card-back${backAlign}">
        <span class="category-tag">${card.cat}</span>
        <span class="face-label">ANSWER</span>
        <p class="en-text">${en}</p>
        ${card.note ? `<p class="note">💡 ${card.note}</p>` : ""}
        <button class="speak-btn" id="speakBtn">🔊 発音を聞く</button>
      </div>
    </div>`;

  document.getElementById("theCard").addEventListener("click", (e) => {
    if (e.target.id === "speakBtn") return;
    flip();
  });
  const sb = document.getElementById("speakBtn");
  if (sb) sb.addEventListener("click", (e) => { e.stopPropagation(); speak(card.en); });
}

// カードをめくる。再描画せずクラスだけ切り替えるのでキー操作でもアニメーションする
function flip() {
  const el = document.getElementById("theCard");
  if (!el) { if (currentRP() && state.index === 0) next(); return; }  // ロールカード画面ではSpaceで開始
  state.flipped = !state.flipped;
  el.classList.toggle("flipped", state.flipped);
}

function next() {
  if (state.index < state.order.length - 1) { stopScript(); state.index++; state.flipped = false; render(); }
}
function prev() {
  if (state.index > 0) { stopScript(); state.index--; state.flipped = false; render(); }
}
function markKnown() {
  const c = currentCard(); if (!c) return;
  const k = cardKey(c);
  state.known[k] = true;
  delete state.review[k];
  state.ts[k] = Date.now();
  saveState(); syncSoon();
  next(); render();
}
function markReview() {
  const c = currentCard(); if (!c) return;
  const k = cardKey(c);
  state.review[k] = true;
  delete state.known[k];
  state.ts[k] = Date.now();
  saveState(); syncSoon();
  next(); render();
}

// --- setup ---
loadState();

// 進捗が保存されない環境であることを黙って隠さない（カードの学習自体は動く）
if (!store.available) {
  const warn = document.createElement("p");
  warn.className = "storage-warn";
  warn.textContent = "⚠️ この環境では進捗（✓・要復習）が保存されません。プライベートブラウズを解除するか、通常のSafariで開いてください。カードの学習はそのまま使えます。";
  document.querySelector("header").insertAdjacentElement("afterend", warn);
}

populateVoices();
if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = populateVoices; // Chromeは非同期で音声リストが届く
}
document.getElementById("voiceSelect").addEventListener("change", (e) => {
  selectedVoiceURI = e.target.value;
  store.set("oet_voice", selectedVoiceURI);
  const c = currentCard();
  if (c) speak(c.en); // 切り替え後すぐ試聴
});

const select = document.getElementById("categorySelect");
const cats = [...new Set(CARDS.map(c => c.cat))];
select.innerHTML =
  `<optgroup label="フレーズ（カテゴリ別）"><option value="all">すべてのカテゴリ (${CARDS.length})</option>` +
  cats.map(c => `<option value="${c}">${c} (${CARDS.filter(x => x.cat === c).length})</option>`).join("") +
  `</optgroup><optgroup label="🎭 ロールプレイ（カード→流れの順）">` +
  ROLEPLAYS.map(r => `<option value="rp:${r.id}">🎭 Card${r.id} ${r.title}</option>`).join("") + `</optgroup>`;

// 選んだカテゴリ／ロールプレイを次回も開く
function applySelection(v) {
  if (v.startsWith("rp:") && ROLEPLAYS.some(r => r.id === v.slice(3))) { state.rp = v.slice(3); state.category = "all"; }
  else { state.rp = null; state.category = (v === "all" || cats.includes(v)) ? v : "all"; }
  select.value = state.rp ? "rp:" + state.rp : state.category;
}
applySelection(store.get("oet_last_cat") || "all");
select.addEventListener("change", () => {
  stopScript(); applySelection(select.value); store.set("oet_last_cat", select.value); rebuildOrder(); render();
});
document.getElementById("shuffleBtn").addEventListener("click", () => { rebuildOrder(true); render(); });
document.getElementById("reviewModeBtn").addEventListener("click", (e) => {
  state.reviewMode = !state.reviewMode;
  e.target.classList.toggle("active", state.reviewMode);
  rebuildOrder(); render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("学習進捗（✓・要復習）をリセットしますか？" + (SY.token ? "\n同期している他の端末からも消えます。" : ""))) {
    state.known = {}; state.review = {}; state.ts = {}; state.resetAt = Date.now();
    saveState(); render(); syncNow();
  }
});
function renderSync() {
  const panel = document.getElementById("syncPanel");
  if (!panel) return;
  panel.innerHTML = SY.token
    ? `<h2>iPhone・iPad間の同期</h2>
       <p class="sync-status ${SY.state === "err" ? "err" : ""}" id="syncStatus">${syncText()}</p>
       <div class="row"><button class="btn" id="syncGoBtn">今すぐ同期</button>
       <button class="btn" id="syncOffBtn">この端末の同期を解除</button></div>
       <p class="note">アプリを開いたときと、印を付けた2秒後に自動で同期します。</p>`
    : `<h2>iPhone・iPad間の同期（GitHubの非公開Gist）</h2>
       <ol>
         <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=OET%20flashcards%20sync" target="_blank" rel="noopener">GitHubのトークン作成画面</a>を開く（gistにだけチェックが入った状態で開きます）</li>
         <li>Expirationを選び、一番下の「Generate token」を押す</li>
         <li>表示された ghp_… をコピーして下に貼り付け、「接続」を押す</li>
         <li>もう一方の端末でも同じトークンを貼り付ける</li>
       </ol>
       <input id="syncToken" type="password" autocomplete="off" placeholder="ghp_…">
       <div class="row"><button class="btn" id="syncOnBtn">接続</button></div>
       <p class="note">トークンはこの端末の中にだけ保存され、GitHub以外には送られません。<br>
       Readingの通勤ドリルと同じトークンを使い回せます（保存先のファイルは別です）。</p>`;
  const on = document.getElementById("syncOnBtn");
  if (on) on.addEventListener("click", () => {
    const t = document.getElementById("syncToken").value.trim();
    if (!t) return;
    SY = { token: t }; saveSY(); renderSync(); syncNow();
  });
  const go = document.getElementById("syncGoBtn");
  if (go) go.addEventListener("click", syncNow);
  const off = document.getElementById("syncOffBtn");
  if (off) off.addEventListener("click", () => {
    if (confirm("この端末の同期を解除します（進捗はこの端末に残ります）")) { SY = {}; saveSY(); renderSync(); }
  });
}
document.getElementById("syncBtn").addEventListener("click", () => {
  const panel = document.getElementById("syncPanel");
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) renderSync();
});
renderSync();
syncNow();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", syncNow);

document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("knowBtn").addEventListener("click", markKnown);
document.getElementById("dontKnowBtn").addEventListener("click", markReview);

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "1") markReview();
  else if (e.key === "2") markKnown();
  else if (e.key.toLowerCase() === "s") { const c = currentCard(); if (c) speak(c.en); }
});

rebuildOrder();
render();
</script>
</body>
</html>
