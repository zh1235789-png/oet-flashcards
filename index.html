<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OET Speaking フラッシュカード</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --primary: #0d7377;
    --primary-dark: #0a5c5f;
    --accent: #f59e0b;
    --text: #1e293b;
    --text-sub: #64748b;
    --green: #16a34a;
    --red: #dc2626;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(13,115,119,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 1.5rem;
    color: var(--primary);
  }
  header p {
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
    max-width: 640px;
  }
  select, .btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #cbd5e1;
    background: var(--card-bg);
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .btn:hover, select:hover { border-color: var(--primary); }
  .btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .storage-warn {
    max-width: 640px;
    margin-bottom: 12px;
    padding: 8px 14px;
    border-radius: 12px;
    background: #fef3c7;
    color: #92400e;
    font-size: 0.78rem;
    line-height: 1.6;
  }
  .progress-wrap {
    width: 100%;
    max-width: 640px;
    margin-bottom: 12px;
  }
  .progress-bar {
    height: 6px;
    background: #dbe4ee;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .card-area {
    width: 100%;
    max-width: 640px;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 320px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
    /* 表裏を同じグリッドセルに重ねる。枠の高さ＝背の高い面の高さになり、
       長い英訳やnoteが枠外へはみ出さない（旧: position:absolute で溢れていた） */
    display: grid;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    grid-area: 1 / 1;
    position: relative;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* 上端の カテゴリタグ / ANSWER ラベル（top:16px・高さ約24px）に本文が重ならない余白 */
    padding: 52px 28px 32px;
    text-align: center;
  }
  .card-back { transform: rotateY(180deg); }
  /* 2文以上の長い答えは中央揃えだと行頭が揃わず読みにくいので左揃えにする */
  .card-face.align-left { text-align: left; }
  .card-face.align-left .note { width: 100%; }
  .category-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 0.72rem;
    background: #e0f2f1;
    color: var(--primary-dark);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .face-label {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 0.72rem;
    color: var(--text-sub);
    letter-spacing: 0.08em;
  }
  .jp-text {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.7;
  }
  .en-text {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.6;
    color: var(--primary-dark);
  }
  .note {
    margin-top: 18px;
    font-size: 0.82rem;
    color: var(--text-sub);
    line-height: 1.6;
    border-top: 1px dashed #cbd5e1;
    padding-top: 12px;
  }
  .hint {
    margin-top: 20px;
    font-size: 0.75rem;
    color: #94a3b8;
  }
  .speak-btn {
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .speak-btn:hover { opacity: 0.85; }
  .nav {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .nav .btn { font-size: 0.9rem; padding: 10px 20px; }
  .btn-know { border-color: var(--green); color: var(--green); }
  .btn-know:hover { background: var(--green); color: #fff; }
  .btn-dontknow { border-color: var(--red); color: var(--red); }
  .btn-dontknow:hover { background: var(--red); color: #fff; }
  .stats {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }
  .stats span.known { color: var(--green); font-weight: 600; }
  .stats span.review { color: var(--red); font-weight: 600; }
  .done-msg {
    text-align: center;
    padding: 60px 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .done-msg h2 { color: var(--primary); margin-bottom: 12px; }
  .done-msg p { color: var(--text-sub); margin-bottom: 20px; line-height: 1.7; }
  kbd {
    background: #e2e8f0;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.72rem;
    font-family: inherit;
  }
  @media (max-width: 480px) {
    .jp-text { font-size: 1.1rem; }
    .en-text { font-size: 1.05rem; }
    .card { min-height: 360px; }
    .card-face { padding: 48px 18px 26px; }
  }
  .sync-panel {
    display: none; max-width: 640px; width: 100%; margin: 0 auto 16px;
    background: var(--card-bg); border: 1px solid #cbd5e1; border-radius: var(--radius);
    padding: 14px 16px; font-size: 0.85rem; color: var(--text);
  }
  .sync-panel.open { display: block; }
  .sync-panel h2 { font-size: 0.95rem; color: var(--primary); margin-bottom: 8px; }
  .sync-panel ol { padding-left: 20px; color: var(--text-sub); line-height: 1.7; }
  .sync-panel a { color: var(--primary); }
  .sync-panel input {
    width: 100%; padding: 10px; margin-top: 8px; font-size: 16px;
    border: 1px solid #cbd5e1; border-radius: 10px; background: var(--bg); color: var(--text);
  }
  .sync-panel .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sync-panel .note { color: var(--text-sub); margin-top: 8px; font-size: 0.78rem; line-height: 1.6; }
  .sync-status { color: var(--text-sub); }
  .sync-status.err { color: var(--red); }

  /* ===== 🎭 ロールプレイ（カード→流れ） ===== */
  .st-導入 { --st: #0d7377; --st-bg: #e0f2f1; }
  .st-問診 { --st: #2563eb; --st-bg: #dbeafe; }
  .st-共感 { --st: #db2777; --st-bg: #fce7f3; }
  .st-説明 { --st: #7c3aed; --st-bg: #ede9fe; }
  .st-提案 { --st: #c2410c; --st-bg: #ffedd5; }
  .st-安心 { --st: #15803d; --st-bg: #dcfce7; }
  .st-締め { --st: #b91c1c; --st-bg: #fee2e2; }
  .st-card, .st-all { --st: #475569; --st-bg: #e2e8f0; }
  .flow {
    width: 100%; max-width: 640px; margin-bottom: 12px;
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .flow button {
    flex: 0 0 auto; border: 1px solid transparent; border-radius: 999px;
    padding: 4px 9px; font-size: 0.72rem; font-family: inherit; cursor: pointer;
    background: var(--st-bg); color: var(--st); font-weight: 600; opacity: 0.55;
  }
  .flow button.done { opacity: 0.9; }
  .flow button.now { opacity: 1; border-color: var(--st); box-shadow: 0 0 0 2px var(--st-bg); }
  .stage-tag {
    position: absolute; top: 16px; left: 16px; font-size: 0.72rem; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; background: var(--st-bg); color: var(--st);
  }
  .task-ref {
    width: 100%; text-align: left; font-size: 0.78rem; line-height: 1.55; color: var(--text-sub);
    background: #f8fafc; border-left: 3px solid var(--st, #cbd5e1); border-radius: 6px;
    padding: 6px 10px; margin-bottom: 14px;
  }
  .task-ref b { color: var(--text); }
  .prev-line {
    width: 100%; text-align: left; font-size: 0.78rem; line-height: 1.5; color: #94a3b8;
    margin-bottom: 12px; font-style: italic;
  }
  .rp-panel {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px 24px; text-align: left; line-height: 1.6;
  }
  .rp-panel .rp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap;
    border-bottom: 2px solid var(--text); padding-bottom: 6px; margin-bottom: 12px; }
  .rp-panel .rp-head b { letter-spacing: 0.06em; font-size: 0.8rem; }
  .rp-panel .rp-head span { font-size: 0.8rem; color: var(--text-sub); }
  .rp-panel h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 10px; }
  .rp-row { display: grid; grid-template-columns: 88px 1fr; gap: 6px 12px; margin-bottom: 10px; font-size: 0.9rem; }
  .rp-row > dt { font-weight: 700; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-sub); padding-top: 2px; }
  .rp-row ol { padding-left: 1.2em; }
  .rp-row li { margin-bottom: 6px; }
  .rp-words { font-size: 0.8rem; background: #fef3c7; color: #92400e; border-radius: 8px; padding: 6px 10px; margin: 6px 0 12px; }
  .rp-flowline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.75rem; margin: 4px 0 14px; color: var(--text-sub); }
  .rp-flowline span.chip { background: var(--st-bg); color: var(--st); border-radius: 999px; padding: 2px 8px; font-weight: 600; }
  .rp-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .rp-actions .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .rp-script { list-style: none; }
  .rp-script li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px dashed #e2e8f0; }
  .rp-script li.speaking { background: #fffbeb; }
  .rp-script .chip { align-self: start; text-align: center; font-size: 0.7rem; font-weight: 700; border-radius: 999px;
    padding: 2px 0; background: var(--st-bg); color: var(--st); }
  .rp-script .en { font-size: 0.92rem; color: var(--primary-dark); font-weight: 600; }
  .rp-script .jp { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; }
  .rp-script.hide-jp .jp { display: none; }
  @media (max-width: 480px) {
    .rp-panel { padding: 18px 16px; }
    .rp-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<header>
  <h1>🩺 OET Speaking フラッシュカード <span style="font-size:0.8rem;color:var(--text-sub)"></span></h1>
  <p>和文を見て英語で言ってみる → カードをタップして答え合わせ<br>🎭 カテゴリ選択の下の「ロールプレイ」で、カード→会話の流れの順に練習</p>
</header>

<div class="controls">
  <select id="categorySelect" aria-label="カテゴリ選択"></select>
  <button class="btn" id="shuffleBtn">🔀 シャッフル</button>
  <button class="btn" id="reviewModeBtn">⭐ 要復習のみ</button>
  <button class="btn" id="resetBtn">↺ 進捗リセット</button>
  <button class="btn" id="syncBtn">☁️ 同期</button>
  <select id="voiceSelect" aria-label="音声選択" title="読み上げ音声"></select>
  <select id="rateSelect" aria-label="読み上げ速度" title="読み上げ速度">
    <option value="0.7">🐢 ゆっくり</option>
    <option value="0.9" selected>標準</option>
    <option value="1.0">ネイティブ速度</option>
  </select>
</div>

<div class="sync-panel" id="syncPanel"></div>

<div class="flow" id="flowRail" hidden></div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text">
    <span id="cardCounter">0 / 0</span>
    <span id="statsText"></span>
  </div>
</div>

<div class="card-area" id="cardArea"></div>

<div class="nav">
  <button class="btn" id="prevBtn">← 前へ</button>
  <button class="btn btn-dontknow" id="dontKnowBtn">✗ 要復習</button>
  <button class="btn btn-know" id="knowBtn">✓ 言えた</button>
  <button class="btn" id="nextBtn">次へ →</button>
</div>
<p class="stats" style="margin-top:16px">
  キー操作: <kbd>Space</kbd> めくる / <kbd>←</kbd><kbd>→</kbd> 移動 / <kbd>1</kbd> 要復習 / <kbd>2</kbd> 言えた / <kbd>S</kbd> 読み上げ
</p>

<script>
const CARDS = [
  // ============ 0. ⭐最優先（全カード共通の必須フレーズ・2026-09-12再編） ============
  // 優先度0 開始→1 締め→1-B 拒否→1-C 直接回答→1-D 用語→1-E 感情→1-F 懸念→2 抵抗→3 共感→4 病歴/診察→理解確認
  {"cat": "⭐最優先", "jp": "こんにちは、担当医の[名前]です。始める前に確認させてください——今日はどうされましたか？", "en": "Hello, my name is Dr [Name], one of the doctors here. Before we start, can I just check — what's brought you in today?", "note": "🥇優先度0・開始の1文【2026-09-12新設】**24本を通して冒頭が毎回違い、毎回ぐだついている**。RP22では名乗りが不明瞭で聞き取れず、RP21は \"Hi, I thank you for coming today, so how about, how are you recently?\" と言い直しで崩れた。最初の10秒は考えずに出せる1文に固定する。"},
  {"cat": "⭐最優先", "jp": "今日はまずいくつか質問させていただいて、それから私の考えをご説明し、最後に一緒に方針を決められればと思います。それでよろしいですか？", "en": "What I'd like to do today is ask you a few questions first, then explain what I think is going on, and then we'll agree on a plan together. Does that sound all right?", "note": "🥇優先度0-B・アジェンダ設定【2026-09-12新設】**24本で一度も明示的にアジェンダを設定していない**。プラン「対策3」の固定アーク0:30-1:00がそのまま空白になっている。Providing Structureはこの1文で立つ。しかも「最後に方針を決める」と宣言しておくと、**締めが自分への予告になる**。"},
  {"cat": "⭐最優先", "jp": "では、まとめますと——あなたは[診断名]で、していただきたいのは[行動]です。[期間]後に再診しましょう。もし[悪化サイン]が起きたら、すぐに[行動]してください。終わる前に、何か他にご質問はありますか？", "en": "So, to summarise — you have [診断], and what I'd like you to do is [行動]. Let's review this in [期間]. If [悪化サイン] happens, please [行動] straight away. Do you have any other questions before we finish?", "note": "🥇優先度1・暗記必須【2026-09-02更新】RP18で要約+行動+最終質問=3/4パーツが初めて1本に同居。ただし最終質問が3:44に先行発火＝順序逆転。⚠️順序厳守：最終質問は必ず一番最後。そしてsafety net（If〜straight away）だけが録音20本で0回＝音読時にこのパーツだけ2回繰り返す。4:30にタイマー、何を話していても割り込んで発動。／📈2026-09-30：RP3（Card03再録）で4:21要約→行動→最終質問→患者の礼で自然完結＝28本で最も締めらしい締め。欠けたのは**真ん中の2文（Let's review〜／If〜straight away）だけ**。音読ではこの2文を大きな声で。"},
  {"cat": "⭐最優先", "jp": "【穴埋め例・膝骨折術後】まとめますと、Aliくんは膝を骨折していて、手術で整復しました。していただきたいのは抗菌薬5日分を飲み切ることです。2週間後に再診しましょう。もし膝が熱を持つ・赤くなる・痛みが強くなったら、すぐに連れてきてください。終わる前に何かご質問はありますか？", "en": "So, to summarise — Ali has a fracture in his knee, which we've realigned surgically, and what I'd like you to do is make sure he finishes all five days of the antibiotics. Let's review him in two weeks. If the knee becomes hot, red or more painful, please bring him straight back. Do you have any other questions before we finish?", "note": "🥇優先度1の穴埋め例。毎日この4か所［診断／行動／期間／悪化サイン］だけを差し替えて音読する。丸ごと新作しないのがコツ。"},
  {"cat": "⭐最優先", "jp": "今それができない理由は[理由]だからです。代わりにできることは[代替案]です。", "en": "The reason I can't [X] just now is [理由]. What I can do instead is [代替].", "note": "🥇優先度1-B【2026-09-02検証済み・効果あり】RP20(守秘義務・怒る夫＝最難関)でこの型が全編機能：拒否→理由(守秘義務/法律)→代替案(STD検査/合同面談)の3点セットで夫を合意まで軟化させ、話速72w/m(対立カード従来52-59)。本番で使える。ドリル継続。"},
  {"cat": "⭐最優先", "jp": "こんなに長くお待たせして本当に申し訳ありません。私でも同じように感じたと思います。今までに何をしたか、ご説明させてください。", "en": "I'm so sorry you've had such a long wait — I'd feel exactly the same. Let me explain what we've already done for her.", "note": "🥇優先度1-B・怒っている家族への初動。RP13では待たせたことへの謝罪がゼロだった。難カードで話速が崩壊(59w/m)するのは内容ではなく言い出しの型が無いため。"},
  {"cat": "⭐最優先", "jp": "残念ながら、検査で少しお話しなければならないことが見つかりました。", "en": "I'm afraid the scan has shown something we need to talk about.", "note": "🥇優先度1-B・bad newsのwarning shot（警告射撃）。RP14では挨拶の直後にいきなり「娘さんに脳腫瘍があります」と告知＝緩衝が皆無。bad newsカードでは単独で大きく減点される。"},
  {"cat": "⭐最優先", "jp": "そばにいていただいて構いませんよ。ただ、光と音だけは抑えておきたいのです。", "en": "You're very welcome to stay with her — we just need to keep the light and noise down.", "note": "🥇優先度1-B・家族を締め出さない。RP13では疎外感を訴える夫に\"Please don't disturb her.\"と命令形で言い渡した＝Deploying diplomacy skillsの直撃。制限は「歓迎＋理由」の順で伝える。"},
  {"cat": "⭐最優先", "jp": "あいにくそれはお伝えできません。ですが、私にできることをお話しします。", "en": "I'm afraid I can't share that — but here's what I can do.", "note": "🥇優先度1-B【2026-09-02追加】RP20で\"I can't help today\"と2回突き放した箇所の置換。断りの直後に必ず代替を接続する。\"I can't help\"は禁止。"},
  {"cat": "⭐最優先", "jp": "いいえ、寝たきりになることはまったくありませんよ。むしろ軽く体を動かすことが大切です——ご説明しますね。", "en": "No, you won't be bed-ridden at all. In fact, gentle movement is important — let me explain.", "note": "🥇優先度1-C【2026-09-02追加】患者の直接質問には「Yes/No+1文」で先に答えてから補足へ。RP17は患者が求めた対症薬の提案をスキップ、RP18はbed-riddenの質問に答えず手配へ跳んだ。"},
  {"cat": "⭐最優先", "jp": "【録音前ルール】その日のカードの固有名詞と中核動詞を、紙に大きく書いて視界に置いたまま話す。", "en": "(RULE) Write the card's proper nouns and key verbs on paper and keep them in sight while you speak.", "note": "🥇優先度1-D改訂【2026-09-12】文で3回音読してもなお崩れた：Drug Z→\"drug C/D\"、produce→\"provide\"×2、dizziness→\"disease\"、symptom→\"shimpton\"×5。音読は聴覚の記憶にしか残らず、話している最中に参照できない。／追加ルール：聞き返されたら同じ文を繰り返さず必ず言い換える（RP24で患者の \"Once again, please.\" に同じ壊れた文で応じた）。"},
  {"cat": "⭐最優先", "jp": "すみません、別の言い方をしますね。", "en": "Sorry, let me put that another way.", "note": "🥇優先度1-D・**聞き返されたら同じ文を繰り返さない**【2026-09-12新設】RP24で \"What wasn't your shimpton?\" が通じず患者に \"Once again, please.\" と言われたのに、**同じ壊れた文をそのまま繰り返した**。本番ならIntelligibilityの実害として記録される場面。聞き返されたら必ずこの1文を挟んで言い換える。"},
  {"cat": "⭐最優先", "jp": "それは本当にご心配ですよね。そう思われるのは当然のことです。", "en": "That sounds really worrying — it's completely understandable.", "note": "🥇優先度1-E・汎用形①不安/恐怖【2026-09-30新設・最頻出】再録4本（Card03/04/06/08）で1-Eの文は1本も出ず、代わりに **\"I know / understand how you feel\" が4/4本**＝3代目の単一テンプレ。原因は9/12の1-Eが「妻」「7年間」とカード固有で持ち出せなかったこと。RP3では「がんが心配」に \"so when did it start?\" と問診で返した。感情語が出たら次の1文はまずこれ。"},
  {"cat": "⭐最優先", "jp": "それは大変ですよね、特にこれだけお忙しいと。", "en": "That does sound hard, especially with how busy you are.", "note": "🥇優先度1-E・汎用形②大変さ/抵抗【2026-09-30新設】RP8「生活を変えるのはtough」、RP6「減らしたら何も食べなくなる」に対し、どちらも \"I know how you feel.\" で返した。「難しい」と言われたら、まず大変さを認める1文→それからスモールステップへ。"},
  {"cat": "⭐最優先", "jp": "お怒りになるのはもっともですし、そうお感じになる権利があります。", "en": "I can see why you're upset, and you have every right to be.", "note": "🥇優先度1-E・汎用形③怒り【2026-09-30新設】9/12の \"You have every right to be upset — you trusted this medicine for seven years…\" をどのカードでも使える形にした。"},
  {"cat": "⭐最優先", "jp": "本当にお気の毒です。とてもつらい時期だったと思います。その後、どう過ごされていますか？", "en": "I'm so sorry. That must have been an incredibly hard time. How have you been coping?", "note": "🥇優先度1-E・汎用形④喪失【2026-09-30新設】9/12の \"Losing your wife…\" の汎用形。必ず問い返しで終える。"},
  {"cat": "⭐最優先", "jp": "【禁止】「お気持ちはわかります」は言わない", "en": "(BANNED) \"I know how you feel\" / \"I understand how you feel\"", "note": "🥇優先度1-E・禁止句【2026-09-30新設】9/30の再録4本すべてで出現（RP3 \"I understand how you feel\"、RP4/6/8 \"I know how you feel\"）。医師には患者の気持ちは分からない＝OETでは空疎に響く。7/1 \"very normal to feel that\" → 9/12 → 9/30と続く3代目のテンプレ族。汎用形①〜④に置き換える。"},
  {"cat": "⭐最優先", "jp": "【死別・喪失】本当にお気の毒です。奥様を亡くされて、この1年はとてもお辛かったでしょう。あれからどのように過ごしてこられましたか？", "en": "I'm so sorry. Losing your wife must have made this a very hard year. How have you been coping since then?", "note": "🥇優先度1-E【2026-09-12追加・次回の最優先】RP22で、妻の死の開示に対し \"I'm sorry to hear that. That's very understandable for your blood cholesterol level.\" と返した＝死を検査値の説明に回収した。24本で最も高くつく失点。必ず「問い返し」で終えること（受け止めて終わらせない）。"},
  {"cat": "⭐最優先", "jp": "【怒り・裏切られた感】お怒りはもっともです。7年間この薬を信頼してこられたのですから、私でも同じように感じます。今わかっていることを正確にお伝えさせてください。", "en": "You have every right to be upset — you trusted this medicine for seven years, and I'd feel the same. Let me tell you exactly what we know.", "note": "🥇優先度1-E【2026-09-12追加】RP21で「7年間信頼してきた薬が発がん性かもしれない」という怒りに対し、統計の説明のみで応答＝謝罪も怒りの承認もなし。カードの中心タスクを素通りした。"},
  {"cat": "⭐最優先", "jp": "【恐怖・子どもの病気】どれほど怖い思いをされているか伝わってきます。当然のお気持ちです。これが日々の生活で実際にどういうことなのか、ご説明させてください。", "en": "I can hear how frightened you are, and that's completely natural. Let me show you what this actually means day to day.", "note": "🥇優先度1-E【2026-09-12追加】RP23で母の「息子の子ども時代が台無しになる」に \"Please rest assured.\" は出たが、最後は \"There is a lot of risk of taking insulin.\" で終了＝24本で最悪の終わり方。"},
  {"cat": "⭐最優先", "jp": "【禁止事項】患者が感情を開示したら、検査値・統計・機序の説明で返さない。まず感情に1文返してから内容へ入る。", "en": "(RULE) When the patient discloses an emotion, never answer with numbers, statistics or mechanism. Give one sentence to the feeling first.", "note": "🥇優先度1-E の運用ルール。引き金＝患者が angry / frightened / devastated / guilty / embarrassed と言う、または喪失・病気を開示した瞬間。次の1文は必ず1-Eの表から出す。2026-09-12の診断：**明示的に型にした能力（1-Bの拒否・safety net）だけが本番で生き残り、型にしていない共感は全面崩壊した**。気をつけるでは直らない。"},
  {"cat": "⭐最優先", "jp": "特定の食べ物を避けても湿疹は防げません。食物アレルギーが原因ではなく、皮膚のバリアの問題です。", "en": "Avoiding certain foods will not prevent eczema. Food allergies do not cause it — it's a problem with the skin barrier.", "note": "🥇優先度1-G・否定はcan'tに頼らない【2026-09-30新設】RP4（Card04再録）で核心の否定が2回とも \"eczema **can** be prevented by avoiding certain foods\" と出た（6/24初回と同じ誤り）。日本語話者のcan'tは語末tが落ちてcanに聞こえる。**will not / does not** で言い、**肯定文で言い直す**。型: [否定 won't/does not] + [本当の原因を肯定文で]。"},
  {"cat": "⭐最優先", "jp": "それだけでは十分ではありませんが、とても良い第一歩です。", "en": "It's not enough on its own, but it's a really good start.", "note": "🥇優先度1-G・\"I don't think\"で始めない【2026-09-30新設】二重否定が2バッチ連続：RP21 \"I don't think they are not enough\"、RP8 \"I don't think it's not good enough\"＝どちらも「十分だ」と逆の意味が伝わった。評価を返すときは主語を It にして肯定→but で。"},
  {"cat": "⭐最優先", "jp": "その説が筋が通っているように思えるのはわかります——実際、関連はあります。ただ…", "en": "I understand why that theory makes sense — they are linked. But…", "note": "🥇優先度1-G・反論されたときの言い直し【2026-09-30新設】RP4で親に \"Some people say avoiding foods can stop eczema\" と反論され、\"I say that…\" と同じ文を繰り返した（対立的＋言い換えなし）。まず相手の説の妥当な部分を認めてから but で訂正。"},
  {"cat": "⭐最優先", "jp": "今いちばん気がかりなのはどんなことですか？", "en": "Can I ask what's worrying you most right now?", "note": "🥇優先度1-F・懸念の引き出し【2026-09-12新設】**Card13（怒る夫）で「夫の懸念を聞き出す」というカードの明示タスクを、能動的に一度も実行しなかった**。Card21でも怒りの中身を聞いていない。この1文だけで Information gathering と共感の両方が取れる。感情が出ている場面では1-Eの直後に置く。"},
  {"cat": "⭐最優先", "jp": "これらの質問をするのは、あなたに最適なアドバイスをするためです。よろしいですか？", "en": "I ask these because they help me give you the best advice — is that okay?", "note": "🥈優先度2・抵抗への対応。患者の「なぜそんなことを聞くの？」に理由を説明せず素通りしない（RP6の失点）。"},
  {"cat": "⭐最優先", "jp": "どれほどご心配だったことか、想像するに余りあります。", "en": "I can only imagine how worrying this must have been for you.", "note": "🥉優先度3・共感ローテーション1/3。\"It is very normal to feel that way\"の使い回し固定化を防ぐ。"},
  {"cat": "⭐最優先", "jp": "あなたと同じ状況の方の多くが、まったく同じように感じていますよ。", "en": "Many people in your situation feel exactly the same way.", "note": "🥉優先度3・共感ローテーション2/3。"},
  {"cat": "⭐最優先", "jp": "苛立ちを感じられるのは、まったく無理もないことです。", "en": "It's completely understandable that you'd feel frustrated.", "note": "🥉優先度3・共感ローテーション3/3。frustrated部分はanxious/upset等に差し替え可。"},
  {"cat": "⭐最優先", "jp": "ご説明する前に、いくつか質問させていただいてもよろしいですか？", "en": "Before I explain, can I ask you a few questions?", "note": "優先度4・病歴聴取への導入シグナル。即説明/診断に入らず、この一言で病歴聴取の抜けを防ぐ（RP1・4・7の失点）。"},
  {"cat": "⭐最優先", "jp": "この先に進む前に、診察させていただいてもよろしいですか？　息を吸って、吐いてください。", "en": "Before we go further, would it be all right if I examined you? — Please breathe in, and breathe out.", "note": "🥇優先度4・診察の許可取り【2026-09-12追加】RP24（胸部診察）とRP12（診察許可）で**明確に加点方向に働いた数少ない要素**。所見に基づいて判断を示せると、拒否や説明の説得力が変わる（RP24は \"Based on your physical examination…\" で断れた）。身体診察のあるカードでは必ず入れる。"},
  {"cat": "⭐最優先", "jp": "ここまでのところ、おわかりいただけましたか？", "en": "Does that make sense so far?", "note": "🥇理解確認ローテ1/3【2026-09-12新設】**\"Is that clear so far?\" をRP21・RP23・RP24で毎回同一使用**＝Resourcesのテンプレ反復に直結。chunk & check 自体は身についているので、あとは3通りを回すだけで加点に変わる。"},
  {"cat": "⭐最優先", "jp": "うまくご説明できていますか？", "en": "Am I explaining that clearly?", "note": "🥇理解確認ローテ2/3。**主語が「私」なので患者を試す形にならない**。"},
  {"cat": "⭐最優先", "jp": "もう一度説明したほうがよいところはありますか？", "en": "Is there anything there you'd like me to go over again?", "note": "🥇理解確認ローテ3/3。説明の区切りごとに1/3→2/3→3/3と変えて使う。"},
  {"cat": "⭐最優先", "jp": "〜ということですね？（事実の確認）", "en": "…Is that right?", "note": "🥇理解確認の補足【2026-09-30新設】事実の確認は \"Is that right?\"。RP3 \"I understand you came here for the result of the test. **Is that okay?**\"、RP6でも同じ＝許可を求める形になっている。"},
  {"cat": "⭐最優先", "jp": "何が起きているのか、わかりやすい言葉でご説明しますね。", "en": "Let me explain what's happening in simple terms.", "note": "🥇封印句の代替【2026-09-12に一軍へ確定】6/24に封印した \"I will explain to you about\" は 8/12・9/12 と**3バッチ連続で再発**している（RP23で2回）。封印だけでは戻ってくるので、**置き換え先をこの1文に固定する**。説明に入る合図は毎回これ。／2026-09-30：RP4で \"can I explain to you about eczema first?\" ＝**4バッチ連続で再発**。"},
  // ============ 0-B. 🔁 再録5枚（Card05→08→06→04→03・2026-09-12追加） ============
  {"cat": "🔁 再録5枚", "jp": "【この順番でやる】05（未実施）→ 08（締めを取る）→ 06（抵抗・直接質問）→ 04（床＋恐怖）→ 03（bad news）", "en": "(ORDER) 05 → 08 → 06 → 04 → 03", "note": "🔁 再録の運用【2026-09-12確定】易→難を崩さないこと。RP21-24で「締めの型が固まらないまま最難度帯に入ると全部崩れる」ことが実証済み。各カードの録音直前に、このカテゴリの該当4-5枚だけを音読する。／2026-09-30：08・06・04・03を再録済み（話速65.5→73.3、Structure 2.0→3.25）。**残りはCard05のみ（3回連続で持ち越し）**。"},
  {"cat": "🔁 再録5枚", "jp": "【05締め】まとめますと、これは軽い帯状疱疹で、していただきたいのはクリームを塗ること、痛みが強ければパラセタモールを飲むことです。発疹は数週間かけて自然に薄くなります。もし発疹が広がってきたり、この方法で抑えられないようなら、すぐに受診してください。終わる前に何かご質問はありますか？", "en": "So, to summarise — this is a mild case of shingles, and what I'd like you to do is apply the cream and take paracetamol if the pain gets bad. The rash should fade by itself over the next few weeks. If the rash starts to spread, or if these simple measures aren't controlling it, please come straight back to me. Do you have any other questions before we finish?", "note": "🔁 Card05・締め4パーツ完成版。**Card05はカードのTask6そのものがsafety net**（「発疹が広がるか、簡単な処置で抑えられなければ再受診するよう助言する」）＝4パーツが自然に揃う唯一のカード。ゲート「連続3本」の起点にする。"},
  {"cat": "🔁 再録5枚", "jp": "【05説明】帯状疱疹は、子どもの頃にかかった水ぼうそうのウイルスが再び活動を始めて起こります。最近の風邪で体の抵抗力が落ちたことが引き金になったのでしょう。", "en": "Shingles happens when the chickenpox virus you had as a child becomes active again — your recent cold lowered your body's resistance, which let it wake up.", "note": "🔁 Card05・診断と原因（カードTask2）。患者は「風邪と関係あるのか」を必ず聞いてくる。因果を1文で結ぶこと。"},
  {"cat": "🔁 再録5枚", "jp": "【05安心】これは他の病気があるという意味ではありませんし、全身に広がることもまずありません。", "en": "This doesn't mean there's anything else wrong with you, and it's very unlikely to spread all over your body.", "note": "🔁 Card05・カードTask5。患者役は「他に悪いところがあるのでは」「全身に広がるのでは」と**繰り返し保証を求めてくる**設定。同じ安心を2回求められても言い換えて返す。"},
  {"cat": "🔁 再録5枚", "jp": "【05・紙に書く】shingles / herpes zoster / varicella-zoster / chickenpox / paracetamol", "en": "(WRITE DOWN) shingles / herpes zoster / varicella-zoster / chickenpox / paracetamol", "note": "🔁 Card05・録音前に紙に書いて視界に置く。**同じ疾患のCard19で varicella→\"Viral\"、shingles→\"singles\" が実際に崩れている**（2026-09-02）。音読だけでは保持できないことが2026-09-12に確定した。"},
  {"cat": "🔁 再録5枚", "jp": "【08締め】まとめますと、息切れは体重から来ていて、していただきたいのは週に1回、外食の夕食を野菜のある家庭料理に替えることです。4週間後に体重を見直しましょう。もし安静にしていても息切れが出たり、夜間に出るようなら、それより早く受診してください。終わる前に何かご質問はありますか？", "en": "So, to summarise — your breathlessness is coming from your weight, and what I'd like you to do is swap one fast-food dinner a week for a home-cooked meal with vegetables. Let's review your weight in four weeks. If you find yourself getting breathless even at rest, or at night, please come back sooner. Do you have any other questions before we finish?", "note": "🔁 Card08・締め4パーツ完成版。**前回(2026-07-01)の失点はまさにここ**＝\"one dinner\"の合意を取った直後に、要約もフォロー日程もなく終了した。内容はR=3で1-8の最高点なので、中身を考えずに締めだけに集中できる＝**ゲートの1本目を取りに行くカード**。"},
  {"cat": "🔁 再録5枚", "jp": "【08スモールステップ】全部を一度に変えるのではなく、まず週に1回の夕食だけから始めてみませんか？", "en": "Rather than changing everything at once — how about we start with just one dinner a week?", "note": "🔁 Card08・**前回◎だった型の保存**。テンプレに頼らない交渉型のスモールステップ提案が自然に出た唯一の回（全24本）。患者は「生活を変えるのは大変だ」と渋る設定なので、要求を小さく割って合意を取る。"},
  {"cat": "🔁 再録5枚", "jp": "【08重要性】息切れの原因は体重そのものです。そして長い目で見ると、心臓発作・脳卒中・糖尿病のリスクも上がります。", "en": "Being overweight is what's causing the breathlessness, and over time it also raises your risk of heart attack, stroke and diabetes.", "note": "🔁 Card08・カードTask2。患者から「なぜ痩せる必要があるのか」と必ず聞かれる。BMIは25.9。"},
  {"cat": "🔁 再録5枚", "jp": "【06抵抗】こうした質問をするのは、お子さんに一番良い助言をするためです。よろしいですか？", "en": "I ask these because they help me give you the best advice — is that okay?", "note": "🔁 Card06・**優先度2はこのカードの失点から作られたのに、原因カードで一度も再テストしていない**。前回(2026-07-01)は母親の \"Why?\"（質問への抵抗）を無視して進行し、Relationship buildingを落とした。質問を続ける前に必ずこの1文を挟む。"},
  {"cat": "🔁 再録5枚", "jp": "【06直接質問】いいえ、そうはなりません。甘い飲み物を減らしても食べなくなることはなく、むしろ糖分でお腹が満たされない分、よく食べるようになる子がほとんどです。", "en": "No, that won't happen — children don't stop eating when you cut the sweet drinks. In fact most eat more, because they're not filling up on sugar.", "note": "🔁 Card06・**優先度1-C（直接質問にまず1文で答える）の適用**。前回は母親の最後の不安「甘い飲料を減らしたら何も食べなくなる」に**無応答のまま録音終了**＝S=1（全24本で最低）の直接原因。2026-09-12のRP24「費用の懸念に無回答」と同型の失敗。"},
  {"cat": "🔁 再録5枚", "jp": "【06安心】この年齢で食べたがらないのはとてもよくあることです。急に成長する時期ではないので、必要な量自体が少ないのです。", "en": "Food refusal is very common at this age — he needs less food right now because he isn't in a phase of rapid growth.", "note": "🔁 Card06・カードTask3。身長体重は年齢相応で異常なし（Task2）。「心配ない」だけで終えず、**なぜ少なくてよいのか**の理由まで言うこと。"},
  {"cat": "🔁 再録5枚", "jp": "【06締め】まとめますと、息子さんの身長も体重も年齢相応でまったく正常です。していただきたいのは、食事の間の甘い飲み物と牛乳を減らすことです。4週間後にもう一度測りましょう。もし体重が減ってきたり、まったく food を受けつけなくなったら、それより早く連れてきてください。終わる前に何かご質問はありますか？", "en": "So, to summarise — he's a perfectly normal weight and height for his age, and what I'd like you to do is cut back the sugary drinks and milk between meals. Let's re-measure him in four weeks. If he starts losing weight, or goes off his food completely, please bring him in sooner. Do you have any other questions before we finish?", "note": "🔁 Card06・締め4パーツ完成版。**カードTask5「4週間後に再測定を申し出る」がそのまま期間パーツになる**ので取りこぼさないこと。"},
  {"cat": "🔁 再録5枚", "jp": "【04恐怖】お子さんのこの先のことがどれほど心配か、伝わってきます。当然のお気持ちです。これが日々の生活で実際にどういうことなのか、ご説明させてください。", "en": "I can hear how worried you are about his future, and that's completely natural. Let me show you what this actually means day to day.", "note": "🔁 Card04・**優先度1-E（恐怖）の適用**。2026-09-12に共感を型にしたので、その初回検証。患者役は「将来が心配」と訴える設定。"},
  {"cat": "🔁 再録5枚", "jp": "【04予後・是正】湿疹はコントロールはできますが、治しきることはできません。ただ、およそ半数のお子さんは成長とともに自然に出なくなります。残る場合でも、十分に管理できます。", "en": "Eczema can be controlled but not cured — and about half of children outgrow it completely. For the rest, it can still be managed well.", "note": "🔁 Card04・**内容の是正①**。前回(2026-06-24)は \"grow out of\" の使い方を誤り、予後の説明が不正確だった。R=1は全24本で唯一＝この回の内容そのものが間違っていた。／⚠️2026-09-30再録でも \"50% of children **have to grow it**\" と同じ誤りが再発。**outgrow** を紙に書いて視界に置く。"},
  {"cat": "🔁 再録5枚", "jp": "【04食物アレルギー・是正】関連はありますが、食物アレルギーが湿疹の原因ではありません。どちらも免疫の問題なので、特定の食べ物を避けても湿疹は防げないのです。", "en": "They are linked, but food allergies don't cause the eczema. Both are problems with the immune system — so avoiding certain foods won't prevent it.", "note": "🔁 Card04・**内容の是正②**。前回は食物アレルギーの説明が矛盾していた（親は食物アレルギー説を信じている設定）。カードTask4の核心。**否定→理由→結論**の順で言い切ること。／⚠️2026-09-30再録でも \"eczema **can** be prevented\"×2で再発（can'tがcanに聞こえる問題）。**will not** と言い、\"Food allergies do not cause it.\" を必ず続ける（1-G）。"},
  {"cat": "🔁 再録5枚", "jp": "【04締め】まとめますと、これは湿疹です。していただきたいのは、保湿を続けることと、石鹸やウールが直接肌に触れないようにすることです。4週間後に診せてください。もし皮膚が熱を持つ、じくじくする、かさぶたになるようなら感染のサインですので、すぐに連れてきてください。終わる前に何かご質問はありますか？", "en": "So, to summarise — this is eczema, and what I'd like you to do is keep his skin moisturised and avoid soap and wool against the skin. Let's review him in four weeks. If the skin becomes hot, weepy or crusted, that can mean infection — please bring him straight in. Do you have any other questions before we finish?", "note": "🔁 Card04・締め4パーツ完成版。前回は**病歴ゼロで即説明に入り**、締めもなく最遅60w/mで終わった。今回は「質問→説明→締め」の順を守る。"},
  {"cat": "🔁 再録5枚", "jp": "【03警告射撃】残念ながら、バリウム検査で少しお話ししなければならないことが見つかりました。", "en": "I'm afraid the barium test has shown something we need to talk about.", "note": "🔁 Card03・**優先度1-B の warning shot**。**Card14（脳腫瘍の告知）では挨拶の直後にいきなり診断を告げ、緩衝が皆無だった**（2026-08-12）。bad newsカードでは単独で大きく減点される。結果を言う前に必ずこの1文を置く。"},
  {"cat": "🔁 再録5枚", "jp": "【03告知】胃の壁に潰瘍があります。このような潰瘍は、場合によってはがんのこともあるので、きちんと調べる必要があります。", "en": "There is an ulcer on the wall of your stomach. In some cases an ulcer like this can be cancerous, so we do need to check it properly.", "note": "🔁 Card03・カードTask1。**「がんかもしれない」を省略しない**こと。ただし断定もしない。possibility として伝える。"},
  {"cat": "🔁 再録5枚", "jp": "【03恐怖】こう聞かされて怖くお感じになるのは当然です。今わかっていることと、これから何をするのかをお話しさせてください。", "en": "I can see this is frightening to hear, and that's completely natural. Let me tell you what we know and what happens next.", "note": "🔁 Card03・**優先度1-E（恐怖）**。前回(2026-06-24)は内容が4本で最良だったのに**緊張でFluencyが崩壊**した（断片・沈黙）。感情に返す固定文を置くことで、次に何を言うか考える時間も稼げる。"},
  {"cat": "🔁 再録5枚", "jp": "【03安心】他にも原因はたくさんあります。単なる潰瘍や消化不良のほうが、がんよりずっとよくある原因です。", "en": "There are lots of other possible causes — a simple ulcer or indigestion are far more common than cancer.", "note": "🔁 Card03・カードTask4。**悪性の話をした後、必ず非悪性の可能性で釣り合いを取る**。これを言わずに終えると不安だけを残す（RP23「There is a lot of risk」型の失敗）。"},
  {"cat": "🔁 再録5枚", "jp": "【03胃カメラ】胃カメラは、細い管の先にカメラが付いたものを胃まで入れて、中を直接見て、小さな組織を採ってくる検査です。", "en": "A gastroscopy means passing a thin tube with a camera down into your stomach, so we can look at it directly and take a small sample.", "note": "🔁 Card03・カードTask3。**できるだけ簡単な言葉で**と指定がある。前回は胃カメラへの恐怖に鎮静で対応できていた（◎）ので、その対応は維持する。"},
  {"cat": "🔁 再録5枚", "jp": "【03締め】まとめますと、検査で直接見る必要のある潰瘍が見つかりました。していただきたいのは胃カメラを受けることです。1週間以内に受けられるよう至急手配します。もし痛みが激しくなったり、血を吐く・黒い便が出るようなら、すぐに救急を受診してください。終わる前に何かご質問はありますか？", "en": "So, to summarise — the test has shown an ulcer that we need to look at directly, and what I'd like you to do is come in for the gastroscopy. I'll arrange it urgently, within the next week. If the pain becomes severe, or you vomit blood or pass black stools, please go to the emergency department straight away. Do you have any other questions before we finish?", "note": "🔁 Card03・締め4パーツ完成版。**5枚で最も safety net が具体的になるカード**（吐血・黒色便）。urgently という語をカードが要求している。"},
  {"cat": "🔁 再録5枚", "jp": "【03・紙に書く】gastroscopy / barium meal / malignant / benign / epigastric / ulcer / specimen", "en": "(WRITE DOWN) gastroscopy / barium meal / malignant / benign / epigastric / ulcer / specimen", "note": "🔁 Card03・録音前に紙に書いて視界に置く。**malignant は2026-09-12のRP14で \"arrogant\" として出ている**。gastroscopy と epigastric も崩れやすい。"},
  // ============ 0-C. 🔁 再録 第2弾（(05)→11→15→14→13・2026-09-30追加） ============
  {"cat": "🔁 再録 第2弾", "jp": "【この順番でやる】(05) → 11 → 15 → 14 → 13", "en": "(ORDER) (05) → 11 → 15 → 14 → 13", "note": "🔁 再録 第2弾の運用【2026-09-30確定・Card11-20から選定】先にCard05を1本（3回連続で持ち越し中・4パーツ完走に最も近い）。その後は易→難の順を崩さない。録音直前に該当カードの5-6枚だけ音読し、【紙に書く】カードの語を紙に書いて視界に置く。外した6枚：12/16/17/20は10本中上位、18は即答の型がRP6で機能済み＋術後で15と重複、19は同じ病気のCard05で測れる。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11感情】お話ししにくいことですよね。でも思っているよりずっとよくあることですし、来てくださって本当によかったです。", "en": "I can see this isn't easy to talk about — it's much more common than you might think, and you did the right thing coming in.", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・**汎用1-Eの最初の検証**。前回は初動で \"That's very embarrassing.\" と患者の羞恥を増幅した。恥ずかしさ→「話しにくいのは当然」＋「よくある」＋「来てよかった」で返す。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11対処】これまで、どうやってやりくりされてきましたか？", "en": "How have you been managing with this so far?", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・カードTask2（どう対処してきたか）。前回は質問が2つだけ。患者は聞かれれば「激しい運動を避ける・水分を控える・人付き合いを避ける」を話す設定＝聞かないと出てこない。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11説明】これは切迫性尿失禁、いわゆる過活動膀胱です。急に強い尿意が来る状態です。年齢とともに骨盤の筋肉が弱くなるので、特に出産経験のある高齢の女性にとても多いんです。", "en": "This is called urge incontinence, or an overactive bladder — it causes a sudden, strong need to pass urine. It's very common in older women, especially those who've had children, because the pelvic muscles get weaker with age.", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・カードTask3-4（診断＋有病率）。「年のせいだと思っていた」という患者の発言への答えにもなる。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11直接質問】はい、十分コントロールできます。ケーゲル体操という骨盤底筋の運動、膀胱訓練、必要ならお薬で良くなります。", "en": "Yes — it can be very well controlled with pelvic floor exercises called Kegel exercises, bladder training and, if needed, medication.", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・1-C（まずYes＋1文）。患者は「治るのか」と驚いて聞く設定。前回はKegelの説明中に切れ、発音も \"KGL\" と不明瞭だった。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11選択肢】泌尿器科の予約をお取りしましょうか？それとも当面、パッドがあると助かりますか？", "en": "Would you like me to refer you to a urologist, or would some pads help in the meantime?", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・カードTask6（患者に選んでもらう）。前回ここは◎だった＝そのまま再現。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11締め】まとめますと、過活動膀胱です。していただきたいのは、毎日ケーゲル体操と膀胱訓練をすることです。6週間後に見直しましょう。もし排尿時の痛みや焼ける感じ、尿に血が混じったら、すぐに来てください。終わる前に、何か他にご質問はありますか？", "en": "So, to summarise — you have an overactive bladder, and what I'd like you to do is start the Kegel exercises and bladder training every day. Let's review this in six weeks. If you notice pain or burning when you pass urine, or blood in your urine, please come back straight away. Do you have any other questions before we finish?", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・穴埋め済みの締め4パーツ。真ん中の2文（期間／悪化時）を大きな声で。"},
  {"cat": "🔁 再録 第2弾", "jp": "【11・紙に書く】urge incontinence / overactive bladder / Kegel exercises / bladder training / urologist / pads", "en": "(WRITE DOWN) urge incontinence / overactive bladder / Kegel exercises / bladder training / urologist / pads", "note": "🔁 Card11 尿失禁（前回 R=3/S=2・69w/m）・録音前に紙に書いて視界に置く。前回 Kegel が \"KGL\"。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15安心】手術はとてもうまくいきました。アリ君は膝の骨折、つまり骨にひびや割れが入っていて、手術でずれた骨を元の位置に戻しました。", "en": "I'm pleased to tell you the surgery went very well. Ali had a fracture — a break in the knee bone — and during the operation we realigned the broken parts.", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・カードTask1。前回は \"operated his surgery\" と言い、同じ内容を断片で3回言い直した＝話速52w/mの原因。この1文で最初の30秒を固定する。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15理由】抗菌薬は5日間すべて飲み切ることが大切です。途中でやめると感染がぶり返すことがあるからです。痛み止めも5日間です。", "en": "It's really important he finishes all five days of the antibiotics, because stopping early can let an infection come back. The painkillers are also for five days.", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・**理由つきの指示**。前回は抗菌薬5日間を「なぜ飲み切るか」言わずに繰り返しただけ（RP13の鎮痛薬と同型の失敗）。指示には必ず because を付ける。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15直接質問】すぐにはまだです。完全に治るまでサッカーは控えてください。ただ、理学療法士が安全に復帰できるよう手伝ってくれます。", "en": "Not just yet — he should avoid football until he's fully recovered, but a physiotherapist will help him get back safely.", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・1-C（まずNo＋1文）。母は「すぐサッカーに戻れるか」を聞く設定。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15紹介】理学療法士をご紹介できます。膝の曲げ伸ばしや体重をかける練習など、回復を早める運動を教えてくれます。", "en": "I can refer him to a physiotherapist, who'll give him exercises like bending and straightening his knee, and help him start putting weight on it.", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・カードTask5。前回は refer が \"refine\" になり、紹介を言いかけて切断した。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15予防】復帰したら、膝パッドや膝のサポーターを着けると次のけがを防げます。", "en": "When he goes back, knee pads and a knee brace will help protect him from another injury.", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・カードTask2（安全装具）。母は「今後のけがを防ぐには？」と聞く設定。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15締め】まとめますと、手術はうまくいってアリ君は順調に回復しています。していただきたいのは、抗菌薬と痛み止めを5日間きちんと飲ませることで、理学療法士にもご紹介します。2週間後に診せてください。もし膝が熱をもったり、赤く腫れたり、痛みが強くなったり、熱が出たりしたら、すぐに連れてきてください。終わる前に、何か他にご質問はありますか？", "en": "So, to summarise — the operation went well and Ali is recovering nicely, and what I'd like you to do is make sure he finishes all five days of the antibiotics and painkillers, and I'll refer him to a physiotherapist. Let's review him in two weeks. If the knee becomes hot, red, swollen or more painful, or he gets a fever, please bring him straight back. Do you have any other questions before we finish?", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・穴埋め済みの締め4パーツ。⭐最優先の締めの穴埋め例と同じカードなので、最も4パーツ完走を狙いやすい。"},
  {"cat": "🔁 再録 第2弾", "jp": "【15・紙に書く】fracture / realign / antibiotics / physiotherapist / refer / knee brace", "en": "(WRITE DOWN) fracture / realign / antibiotics / physiotherapist / refer / knee brace", "note": "🔁 Card15 膝骨折術後（前回 R=2/S=2・52w/m＝28本で最遅）・前回 refer→\"refine\"、\"operated his surgery\"。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14警告射撃】パーカーさん、残念ながらMRIで大切なお話をしなければならないことが見つかりました。今お話ししてもよろしいですか？", "en": "Mr Parker, I'm afraid the MRI scan has shown something serious that we need to talk about. Is now a good time?", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・**前回は警告射撃なしで即告知**。9/30のRP3（Card03）で警告射撃は逐語で出せた＝より重いカードでも出るかの検証。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14告知】MRIで、フィオナちゃんの脳の後ろ側に腫瘍が見つかりました。良い知らせは、それが良性だということです。つまり体の他の部分に広がることはありません。", "en": "The scan has shown a tumour at the back of Fiona's brain. The good news is that it's benign — that means it won't spread to other parts of her body.", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・カードTask1-2。告知の直後に「良性」を続ける。**禁止：\"It's very rare to find a brain tumour\"**（前回これで不安を増幅した）。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14恐怖】ちょっとしたことだと思っていらしたのに、大変なショックですよね。ゆっくりで大丈夫です。", "en": "I can see this has come as a huge shock — you were expecting something minor. Take your time.", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・汎用1-E（恐怖・ショック）の適用。父は「軽いものだと思っていた」とショックを表す設定。説明に入る前に1文、そして間を取る。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14手術】手術はとても安全で、フィオナちゃんは眠っている間に終わるので痛みはありません。完全に回復すると考えています。", "en": "The surgery is very safe, and Fiona will be asleep the whole time, so she won't feel any pain. We expect her to recover completely.", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・1-C。父は「手術は安全か・痛みは」と聞く設定。まず Yes にあたる \"very safe\" から。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14自責】これは決してあなたのせいではありません。あなたが何かをした、しなかったから起きたのではないんです。同じ立場の親御さんの支援グループをご紹介しましょうか？", "en": "This is not your fault at all — nothing you did or didn't do caused this. Would it help if I put you in touch with a support group for parents in the same situation?", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・カードTask6。**前回は支援グループの紹介が丸ごと欠落**し、自責への返答直後に切断した。1-G：否定は \"not your fault\" と言い切る。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14締め】まとめますと、フィオナちゃんの腫瘍は良性で、取り除く手術はとても安全です。退院後は、腫瘍がすべて取れたか確認するために数週間後に外来で診せていただき、必要なら理学療法や言語療法もご用意します。もしご自宅でひどい頭痛や嘔吐、ひどく眠そうな様子があれば、すぐに連れてきてください。終わる前に、何か他にご質問はありますか？", "en": "So, to summarise — Fiona has a benign tumour, and the surgery to remove it is very safe. After she goes home, we'll see her in clinic in a few weeks to make sure it's all been removed, and arrange physiotherapy or speech therapy if she needs it. If she has a bad headache, vomiting or seems very drowsy at home, please bring her straight back. Do you have any other questions before we finish?", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・穴埋め済みの締め4パーツ（カードTask4-5のフォローアップと療法もここで回収）。"},
  {"cat": "🔁 再録 第2弾", "jp": "【14・紙に書く】tumour / benign / sedated / follow-up / speech therapy / occupational therapy / support group", "en": "(WRITE DOWN) tumour / benign / sedated / follow-up / speech therapy / occupational therapy / support group", "note": "🔁 Card14 小児脳腫瘍の告知（前回 R=3/S=3・64w/m）・録音前に紙に書いて視界に置く。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13謝罪＋怒り】長くお待たせして本当に申し訳ありません。お怒りになるのはもっともですし、そうお感じになる権利があります。", "en": "I'm so sorry you've had such a long wait. I can see why you're upset, and you have every right to be.", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・1-B（謝罪）＋汎用1-E（怒り）の連結。前回は謝罪ゼロ、共感は \"I understand your situation\" の1回のみ。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13懸念】今いちばん気がかりなのは何か、伺ってもいいですか？", "en": "Can I ask what's worrying you most right now?", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・1-F。カードTask2「夫の懸念を聞き出す」を前回は**能動的に一度も実行しなかった**（質問ゼロ）。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13安心】奥さまは重い片頭痛です。それ以上に深刻な病気の兆候はありません。", "en": "Your wife has a severe migraine — there's no sign of anything more serious.", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・カードTask3。1-G：否定は \"no sign of\" で言い切る。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13拒否】今これ以上痛み止めを出せないのは、すでに強い痛み止めを使っていて、さらに増やすと副作用で危険だからです。30分ほどで効いてくるはずです。", "en": "The reason I can't give her more painkillers just now is that we've already given her a strong dose, and more could cause harmful side effects. It should start working within about thirty minutes.", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・1-B「理由から始める拒否」。前回は鎮痛薬を足せない**理由を言わなかった**。この型はCard20・24で機能済み。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13ドア】どうぞ奥さまのそばにいてください。ドアを閉めたのは、光と音で片頭痛が悪化するので、部屋を暗く静かにするためです。", "en": "You're very welcome to stay with her — we closed the door to keep the room dark and quiet, because light and noise can make a migraine worse.", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・カードTask5。前回は疎外された夫に \"Please don't disturb her.\" と命令形＝diplomacy直撃。「歓迎→理由」の順。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13締め】まとめますと、アニーさんは重い片頭痛で、すでに強い痛み止めを使っていて30分ほどで効くはずです。30分後にまた様子を見に来ます。もし痛みがさらに強くなったり、手足の力が入らない、混乱している、吐くといった様子があれば、すぐに看護師を呼んでください。終わる前に、何か他にご質問はありますか？", "en": "So, to summarise — Annie has a severe migraine, and she's already had strong pain relief, which should work within thirty minutes. I'll come back and check on her in half an hour. If her pain gets worse, or she has any weakness, confusion or vomiting, please call a nurse straight away. Do you have any other questions before we finish?", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・穴埋め済みの締め4パーツ（ED版：期間＝30分後に再訪）。"},
  {"cat": "🔁 再録 第2弾", "jp": "【13・紙に書く】migraine / painkillers / side effects / thirty minutes / dark and quiet", "en": "(WRITE DOWN) migraine / painkillers / side effects / thirty minutes / dark and quiet", "note": "🔁 Card13 怒る夫・片頭痛（前回 R=2/S=2・59w/m＝10本中最低）・録音前に紙に書いて視界に置く。"},
  // ============ 1. 導入・挨拶 ============
  { cat: "導入・挨拶", jp: "こんにちは、本日診察を担当いたします、医師のノハラと申します。", en: "Hello, my name is Dr [Name]. I'm the doctor looking after you today.", note: "自己紹介はロールプレイ冒頭の定型。Dr + 姓で名乗り、職種を添える。" },
  { cat: "導入・挨拶", jp: "お名前を確認させていただいてもよろしいですか？", en: "Could I just confirm your name, please?", note: "Could I just... で柔らかい依頼に。" },
  { cat: "導入・挨拶", jp: "今日はどうなさいましたか？", en: "What brings you in today? / How can I help you today?", note: "オープニングの定番質問。" },
  { cat: "導入・挨拶", jp: "今日の体調はいかがですか？", en: "How are you feeling today?", note: "" },
  { cat: "導入・挨拶", jp: "お話しする前に、少しお時間をいただいてもよろしいでしょうか？", en: "Before we start, would you mind if I take a few minutes of your time?", note: "Would you mind if... は丁寧な許可の求め方。" },
  { cat: "導入・挨拶", jp: "おかけになって、楽になさってください。", en: "Please take a seat and make yourself comfortable.", note: "" },

  // ============ 2. 共感・安心 ============
  { cat: "共感・安心", jp: "それはおつらいでしょうね。", en: "That must be really difficult for you.", note: "must be で相手の気持ちを推し量る共感表現。" },
  { cat: "共感・安心", jp: "ご心配なお気持ち、よくわかります。", en: "I completely understand your concern.", note: "I understand how you feel. も可。" },
  { cat: "共感・安心", jp: "ご不安に感じられるのは当然のことです。", en: "It's completely understandable that you feel anxious about this.", note: "感情の正当化（validation）はOET高評価ポイント。" },
  { cat: "共感・安心", jp: "どうかご安心ください。私たちが最善のケアをいたします。", en: "Please rest assured that we will provide you with the best possible care.", note: "rest assured = 安心する（フォーマル）。" },
  { cat: "共感・安心", jp: "心配なさらないでください。これはよくあることです。", en: "Please don't worry. This is quite common.", note: "" },
  { cat: "共感・安心", jp: "大変な思いをされましたね。", en: "You've been through a lot, haven't you?", note: "付加疑問で寄り添いを示す。" },
  { cat: "共感・安心", jp: "おっしゃりたいこと、よくわかります。", en: "I can see where you're coming from.", note: "相手の立場への理解を示すイディオム。" },
  { cat: "共感・安心", jp: "何かご心配なことがあれば、いつでもおっしゃってください。", en: "If you have any concerns, please don't hesitate to let me know.", note: "don't hesitate to... = 遠慮なく〜する。" },

  // ============ 3. 情報収集 ============
  { cat: "情報収集", jp: "その痛みについて、もう少し詳しく教えていただけますか？", en: "Could you tell me a bit more about the pain?", note: "" },
  { cat: "情報収集", jp: "症状はいつ頃から始まりましたか？", en: "When did the symptoms first start?", note: "" },
  { cat: "情報収集", jp: "痛みを10段階で表すと、どのくらいですか？", en: "On a scale of zero to ten, how would you rate your pain?", note: "ペインスケールの定番表現。" },
  { cat: "情報収集", jp: "どのような痛みですか？ズキズキしますか、それとも刺すような痛みですか？", en: "What kind of pain is it? Is it throbbing or stabbing?", note: "throbbing=ズキズキ, stabbing=刺すような, dull=鈍い, burning=焼けるような。" },
  { cat: "情報収集", jp: "現在、何かお薬を服用されていますか？", en: "Are you currently taking any medications?", note: "" },
  { cat: "情報収集", jp: "何かアレルギーはお持ちですか？", en: "Do you have any allergies?", note: "" },
  { cat: "情報収集", jp: "ご家族に同じような病気の方はいらっしゃいますか？", en: "Does anyone in your family have a similar condition?", note: "家族歴 = family history。" },
  { cat: "情報収集", jp: "他に気になる症状はありますか？", en: "Are there any other symptoms that concern you?", note: "" },
  { cat: "情報収集", jp: "普段の生活で、食事や運動の習慣について教えていただけますか？", en: "Could you tell me about your diet and exercise habits?", note: "生活習慣の聞き取り。" },
  { cat: "情報収集", jp: "立ち入ったことを伺いますが、飲酒や喫煙はされますか？", en: "I need to ask you a few personal questions. Do you drink or smoke?", note: "前置きを入れるのがマナー。" },

  // ============ 4. 説明 ============
  { cat: "説明", jp: "検査の結果について、ご説明させていただきます。", en: "Let me explain the results of your test.", note: "I'd like to explain... でも可。" },
  { cat: "説明", jp: "簡単に言いますと、血圧が通常より高い状態です。", en: "To put it simply, your blood pressure is higher than normal.", note: "to put it simply = 専門用語を避ける合図。" },
  { cat: "説明", jp: "この薬は1日2回、食後に服用してください。", en: "Please take this medication twice a day after meals.", note: "" },
  { cat: "説明", jp: "この処置には数分かかりますが、痛みはほとんどありません。", en: "This procedure will only take a few minutes, and you'll feel little to no pain.", note: "" },
  { cat: "説明", jp: "副作用として、眠気を感じることがあります。", en: "As a side effect, you may feel drowsy.", note: "drowsy = 眠気がある。" },
  { cat: "説明", jp: "傷口を清潔に保ち、濡らさないようにしてください。", en: "Please keep the wound clean and dry.", note: "" },
  { cat: "説明", jp: "数日間は激しい運動を避けていただく必要があります。", en: "You'll need to avoid strenuous exercise for a few days.", note: "strenuous = 激しい・骨の折れる。" },
  { cat: "説明", jp: "これから診察させていただいてもよろしいですか？お腹を拝見しますね。", en: "Would it be all right if I examine you now? I'd like to have a look at your abdomen.", note: "身体診察の前は必ず許可を取る（consent）。OETの重要評価項目。" },
  { cat: "説明", jp: "診察の結果、胃炎の可能性が高いと考えられます。", en: "Based on the examination, it's most likely that you have gastritis.", note: "診断は it's likely that... / it appears that... で断定を和らげる。" },
  { cat: "説明", jp: "炎症を抑えるお薬を処方いたしますね。", en: "I'm going to prescribe you some medication to reduce the inflammation.", note: "prescribe = 処方する。" },
  { cat: "説明", jp: "念のため、血液検査とレントゲンを受けていただきたいと思います。", en: "Just to be on the safe side, I'd like you to have a blood test and an X-ray.", note: "just to be on the safe side = 念のため。検査オーダーの定型。" },
  { cat: "説明", jp: "より詳しい検査のため、専門医をご紹介します。", en: "I'm going to refer you to a specialist for further tests.", note: "refer A to B = AをBに紹介する。referral = 紹介状。" },
  { cat: "説明", jp: "経過を見るために、来週もう一度お越しいただきたいのですが。", en: "I'd like you to come back next week so we can monitor your progress.", note: "" },
  { cat: "説明", jp: "万が一症状が悪化した場合は、すぐにご連絡ください。", en: "If your symptoms get worse, please contact us immediately.", note: "" },

  // ============ 5. 確認・理解度チェック ============
  { cat: "確認・理解", jp: "ここまでで、何かご質問はありますか？", en: "Do you have any questions so far?", note: "説明の区切りごとに挟むと高評価。" },
  { cat: "確認・理解", jp: "私の説明でわかりにくいところはありませんでしたか？", en: "Is there anything I've said that wasn't clear?", note: "" },
  { cat: "確認・理解", jp: "念のため、今お伝えした内容をご自身の言葉で確認させていただけますか？", en: "Just to make sure, could you repeat back to me what we've discussed in your own words?", note: "teach-back法。患者理解の確認テクニック。" },
  { cat: "確認・理解", jp: "つまり、夜になると痛みが強くなるということですね？", en: "So, what you're saying is that the pain gets worse at night, is that right?", note: "パラフレーズで聞き取り内容を確認。" },
  { cat: "確認・理解", jp: "恐れ入りますが、もう一度おっしゃっていただけますか？", en: "I'm sorry, could you say that again, please?", note: "聞き返しも減点ではなく自然なやり取り。" },
  { cat: "確認・理解", jp: "私の理解が正しければ、薬を飲み忘れることが多いのですね。", en: "If I understand correctly, you often forget to take your medication.", note: "" },

  // ============ 6. 説得・アドバイス ============
  { cat: "説得・アドバイス", jp: "禁煙されることを強くお勧めします。", en: "I strongly recommend that you quit smoking.", note: "recommend that you (should) + 動詞原形。" },
  { cat: "説得・アドバイス", jp: "塩分を控えめにしていただくと、血圧の改善が期待できます。", en: "Cutting down on salt would help improve your blood pressure.", note: "cut down on = 〜を減らす。" },
  { cat: "説得・アドバイス", jp: "お気持ちはわかりますが、この治療を受けることがご自身のためになると思います。", en: "I understand how you feel, but I believe this treatment would be in your best interest.", note: "in your best interest = あなたのためになる。" },
  { cat: "説得・アドバイス", jp: "すぐには難しいかもしれませんが、少しずつ始めてみませんか？", en: "It might be hard at first, but why don't we start with small steps?", note: "why don't we...? で押しつけない提案。" },
  { cat: "説得・アドバイス", jp: "治療を受けない場合、症状が悪化するリスクがあります。", en: "If you don't receive the treatment, there's a risk that your condition could get worse.", note: "リスク説明は could で断定を避ける。" },
  { cat: "説得・アドバイス", jp: "ご家族に相談してから決めていただいても構いませんよ。", en: "You're welcome to discuss it with your family before making a decision.", note: "患者の自己決定権の尊重。" },
  { cat: "説得・アドバイス", jp: "一緒に実行しやすい計画を立てていきましょう。", en: "Let's work together to come up with a plan that works for you.", note: "協働的な姿勢を示すフレーズ。" },

  // ============ 7. 悪い知らせの伝え方 ============
  { cat: "悪い知らせ", jp: "今日は検査結果について、大切なお話があります。", en: "I'm afraid I have some important news to discuss with you today regarding your test results.", note: "warning shot（前置き）。いきなり本題に入らず心の準備をしてもらう。" },
  { cat: "悪い知らせ", jp: "お話しする前に、ご自身の病状についてどこまでご存知か教えていただけますか？", en: "Before we go on, could you tell me what you already understand about your condition?", note: "SPIKESのPerception。患者の認識を先に確認する。" },
  { cat: "悪い知らせ", jp: "結果について、どこまで詳しくお知りになりたいですか？", en: "How much detail would you like me to go into about the results?", note: "SPIKESのInvitation。知りたい範囲は患者に決めてもらう。" },
  { cat: "悪い知らせ", jp: "残念ながら、検査の結果は私たちが期待していたものではありませんでした。", en: "I'm afraid the results were not what we had hoped for.", note: "I'm afraid... = 残念ながら。悪い知らせの定番の切り出し。" },
  { cat: "悪い知らせ", jp: "大変申し上げにくいのですが、腫瘍が見つかりました。", en: "I'm very sorry to have to tell you this, but we have found a tumour.", note: "率直に、しかし思いやりを持って伝える。婉曲にしすぎない。" },
  { cat: "悪い知らせ", jp: "少しお時間を取りましょう。今のお気持ちをお聞かせいただけますか？", en: "Let's take a moment. Would you like to tell me how you're feeling right now?", note: "沈黙を恐れず、感情への対応（Emotions）を優先する。" },
  { cat: "悪い知らせ", jp: "一度にすべてを受け止めるのは難しいと思います。", en: "I know this is a lot to take in.", note: "take in = 理解する・受け止める。" },
  { cat: "悪い知らせ", jp: "どんな時も、私たちが一歩一歩しっかりサポートしていきます。", en: "Whatever happens, we will be here to support you every step of the way.", note: "every step of the way = 終始ずっと。希望と継続的支援を示す。" },
  { cat: "悪い知らせ", jp: "ご希望であれば、ご家族ご同席のもとで改めてご説明することもできます。", en: "If you'd like, we can go through this again together with your family.", note: "go through = 一つずつ説明する。" },

  // ============ 8. 治療拒否への対応 ============
  { cat: "治療拒否への対応", jp: "治療をためらわれている理由を教えていただけますか？", en: "Could you tell me what's making you reluctant to have the treatment?", note: "reluctant = 気が進まない。まず理由の傾聴から始める。" },
  { cat: "治療拒否への対応", jp: "無理強いするつもりはまったくありません。最終的に決めるのはご自身です。", en: "I'm not here to pressure you at all. The final decision is entirely yours.", note: "患者の自己決定権（autonomy）の尊重を明言する。" },
  { cat: "治療拒否への対応", jp: "ただ、決断される前に、リスクについて十分ご理解いただきたいのです。", en: "However, before you make a decision, I want to make sure you fully understand the risks involved.", note: "" },

      { s: "安心", t: 4, jp: "発疹はふつう数週間で自然に消えます。小さくてもつらいものなので、それまで症状はきちんと抑えましょう。", en: "The rash usually fades by itself over a few weeks — though even a small patch can be uncomfortable, so we'll keep you comfortable in the meantime." },
      { s: "安心", t: 5, jp: "これは他の病気があるという意味ではありませんし、全身に広がることもまずありません。", en: "This doesn't mean there's anything else wrong with you, and it's very unlikely to spread all over your body.", n: "患者は繰り返し保証を求める設定。2回目は言い換えて返す。" },
      { s: "締め", t: 6, jp: "まとめますと、これは軽い帯状疱疹で、していただきたいのはクリームを塗ること、痛みが強ければパラセタモールを飲むことです。発疹は数週間かけて自然に薄くなります。もし発疹が広がってきたり、この方法で抑えられないようなら、すぐに受診してください。終わる前に何かご質問はありますか？", en: "So, to summarise — this is a mild case of shingles, and what I'd like you to do is apply the cream and take paracetamol if the pain gets bad. The rash should fade by itself over the next few weeks. If the rash starts to spread, or if these simple measures aren't controlling it, please come straight back to me. Do you have any other questions before we finish?", n: "Task6がそのまま safety net＝4パーツが自然に揃うカード。" },
    ] },

  { id: "06", title: "2歳児の食欲不振", setting: "Suburban general practice",
    brief: "A parent is worried about their two-year-old son's poor appetite. He is well, active, and his weight and height are normal for his age. The parent is anxious and not easily reassured.",
    tasks: [
      "Find out about the child's eating behaviour and diet (fruit, vegetables, meat, drinks).",
      "Explain that he is healthy and a normal weight and height for his age.",
      "Explain that food refusal is common at this age and he needs less food when not growing rapidly.",
      "Discuss his milk and sugary drinks and suggest cutting down (tooth decay, obesity, reduced appetite).",
      "Offer to review and re-measure him in four weeks.",
    ],
    words: "appetite / picky eater / sugary drinks / tooth decay / re-measure",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。息子さんの食欲のことでご心配だと伺いました。", en: "Hello, I'm Dr [Name]. I understand you're worried about your son's appetite." },
      { s: "問診", t: 1, jp: "普段、1日にどんなものを食べたり飲んだりしていますか？ 果物や野菜、お肉、飲み物などを教えてください。", en: "Could you tell me what he usually eats and drinks in a day — fruit, vegetables, meat, and what he drinks?" },
      { s: "共感", t: 1, jp: "こうした質問をするのは、お子さんに一番良い助言をするためです。よろしいですか？", en: "I ask these because they help me give you the best advice — is that okay?", n: "前回は母親の \"Why?\" を無視して進め、Relationship building を落とした。" },
      { s: "安心", t: 2, jp: "診察したところ、息子さんはとても元気で、身長も体重も年齢相応です。", en: "Having examined him, he looks perfectly healthy, and his weight and height are normal for his age." },
      { s: "安心", t: 2, jp: "今のところ検査は必要ありません。成長も発達も順調で、病気を疑うサインがないからです。", en: "He doesn't need any tests at the moment, because he's growing and developing normally, and there are no warning signs of illness.", n: "患者は「検査は要らないのか」と聞く設定。1-C：まず1文で答えて理由を続ける。" },
      { s: "安心", t: 3, jp: "この年齢で食べたがらないのはとてもよくあることです。急に成長する時期ではないので、必要な量自体が少ないのです。", en: "Food refusal is very common at this age — he needs less food right now because he isn't in a phase of rapid growth." },
      { s: "提案", t: 4, jp: "牛乳や甘い飲み物でお腹がいっぱいになると、食事を食べなくなります。虫歯や肥満の原因にもなるので、減らしてみませんか？", en: "Milk and sugary drinks fill him up, so he's less hungry at mealtimes — and they can also cause tooth decay and weight problems. How about we cut them down?" },
      { s: "安心", t: 4, jp: "いいえ、そうはなりません。甘い飲み物を減らしても食べなくなることはなく、むしろ糖分でお腹が満たされない分、よく食べるようになる子がほとんどです。", en: "No, that won't happen — children don't stop eating when you cut the sweet drinks. In fact most eat more, because they're not filling up on sugar.", n: "1-C：直接質問にまず1文で答える。前回はここで無応答のまま終了（S=1）。" },
      { s: "締め", t: 5, jp: "まとめますと、息子さんの身長も体重も年齢相応でまったく正常です。していただきたいのは、食事の間の甘い飲み物と牛乳を減らすことです。4週間後にもう一度測りましょう。もし体重が減ってきたり、まったく食べなくなったら、それより早く連れてきてください。終わる前に何かご質問はありますか？", en: "So, to summarise — he's a perfectly normal weight and height for his age, and what I'd like you to do is cut back the sugary drinks and milk between meals. Let's re-measure him in four weeks. If he starts losing weight, or goes off his food completely, please bring him in sooner. Do you have any other questions before we finish?" },
    ] },

  { id: "07", title: "ベトナム渡航前の予防接種", setting: "General practitioner clinic",
    brief: "Mr Maxwell Tusk, 42, is visiting Vietnam next month. Advise him on the WHO-recommended travel vaccinations.",
    tasks: [
      "Ask how long he will be travelling.",
      "Find out his vaccination history.",
      "Explain the need for typhoid and hepatitis A vaccines (medium-risk country; what each disease is).",
      "If asked, assure him the injections are only mildly painful.",
      "Explain why vaccines should be given at least two weeks before travel (time to build immunity).",
    ],
    words: "typhoid / hepatitis A / vaccination / immunity / contagious",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、タスクさん。[名前]です。来月ベトナムへ行かれるので、予防接種のご相談と伺いました。", en: "Hello, Mr Tusk, I'm Dr [Name]. I understand you're travelling to Vietnam next month and would like some advice about vaccinations." },
      { s: "問診", t: 1, jp: "どのくらいの期間滞在されますか？", en: "How long will you be staying in Vietnam?" },
      { s: "問診", t: 2, jp: "これまでに受けた予防接種を教えていただけますか？ 腸チフスやA型肝炎のワクチンを受けたことはありますか？", en: "Could you tell me which vaccinations you've had in the past? Have you ever had the typhoid or hepatitis A vaccine?" },
      { s: "提案", t: 3, jp: "ベトナムは中程度のリスクの国なので、出発前に腸チフスとA型肝炎の予防接種をお勧めします。", en: "Vietnam is a medium-risk country, so I'd recommend vaccinations against typhoid and hepatitis A before you go." },
      { s: "説明", t: 3, jp: "腸チフスは細菌による病気で、発熱、だるさ、腹痛、嘔吐を起こします。A型肝炎はウイルスで肝臓に炎症を起こし、疲れや吐き気が出ます。どちらもうつりやすいですが、ワクチンで防げます。", en: "Typhoid is a bacterial infection that causes fever, weakness, stomach pain and vomiting. Hepatitis A is a virus that inflames the liver and makes you tired and sick. Both spread easily, but both can be prevented with a vaccine." },
      { s: "安心", t: 4, jp: "注射の痛みはほんの少しで、十分我慢できる程度です。", en: "The injections only hurt a little — most people find them very easy to tolerate." },
      { s: "説明", t: 5, jp: "免疫ができるまで2週間以上かかるので、出発の少なくとも2週間前までに接種してください。", en: "It takes more than two weeks for your body to build up protection, so you'll need to have them at least two weeks before you travel." },
      { s: "締め", t: 0, jp: "まとめますと、腸チフスとA型肝炎のワクチンをお勧めします。していただきたいのは、出発の2週間以上前に接種を済ませることです。今日予約をお取りしましょう。もし旅行中や帰国後に高熱、下痢、皮膚や目が黄色くなるなどがあれば、すぐに受診してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — I recommend the typhoid and hepatitis A vaccines, and what I'd like you to do is have them at least two weeks before you leave. Let's book them in today. If you get a high fever, diarrhoea, or yellowing of your skin or eyes during or after your trip, please see a doctor straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "08", title: "体重管理と息切れ", setting: "Community health centre",
    brief: "A 39-year-old police officer is overweight (BMI 25.9) and gets breathless on exertion.",
    tasks: [
      "Ask about lifestyle (drinking, eating habits and exercise).",
      "Explain why losing weight matters (causes the symptoms; risk of heart attack, stroke, diabetes).",
      "Emphasise physical activity and a balanced diet.",
      "Encourage leafy vegetables and whole fruits.",
      "Explain the need to avoid junk food, sugary food and alcohol.",
    ],
    words: "breathlessness / BMI / leafy vegetables / junk food / heart attack / stroke / diabetes",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、[名前]です。動いたときに息切れがすると伺いました。", en: "Hello, I'm Dr [Name]. I understand you've been getting breathless when you exert yourself." },
      { s: "問診", t: 1, jp: "普段の食事やお酒、運動について教えていただけますか？", en: "Could you tell me a bit about your usual diet, how much you drink, and how much exercise you get?" },
      { s: "説明", t: 2, jp: "息切れの原因は体重そのものです。そして長い目で見ると、心臓発作・脳卒中・糖尿病のリスクも上がります。", en: "Being overweight is what's causing the breathlessness, and over time it also raises your risk of heart attack, stroke and diabetes." },
      { s: "説明", t: 3, jp: "体重を落とすには、体を動かすことと、バランスの良い食事の両方が大切です。", en: "To lose weight, both regular physical activity and a well-balanced diet are important." },
      { s: "提案", t: 4, jp: "キャベツやブロッコリー、ほうれん草などの葉物野菜と、りんごやベリーなどの果物を増やしてみてください。", en: "I'd suggest eating more leafy vegetables like cabbage, broccoli and spinach, and whole fruits like apples and berries." },
      { s: "提案", t: 5, jp: "ジャンクフードや甘いもの、お酒は体重が増える原因になるので、控えましょう。", en: "Junk food, sugary foods and alcohol all add to your weight, so it's best to cut down on them." },
      { s: "共感", t: 5, jp: "全部を一度に変えるのではなく、まず週に1回の夕食だけから始めてみませんか？", en: "Rather than changing everything at once — how about we start with just one dinner a week?", n: "前回◎だった型。患者は「生活を変えるのは大変」と渋る設定。要求を小さく割る。" },
      { s: "締め", t: 0, jp: "まとめますと、息切れは体重から来ていて、していただきたいのは週に1回、外食の夕食を野菜のある家庭料理に替えることです。4週間後に体重を見直しましょう。もし安静にしていても息切れが出たり、夜間に出るようなら、それより早く受診してください。終わる前に何かご質問はありますか？", en: "So, to summarise — your breathlessness is coming from your weight, and what I'd like you to do is swap one fast-food dinner a week for a home-cooked meal with vegetables. Let's review your weight in four weeks. If you find yourself getting breathless even at rest, or at night, please come back sooner. Do you have any other questions before we finish?", n: "前回の失点はここ＝合意の直後に要約もフォロー日程もなく終了。" },
    ] },

  { id: "09", title: "インスリン自己注射の指導", setting: "Patient's home",
    brief: "You are visiting Mrs Bertha Campbell at home to teach her to inject insulin. She is worried and believes diet and tablets are controlling her diabetes well enough.",
    tasks: [
      "Respond kindly and empathetically to her concerns.",
      "Explain why insulin is necessary (not enough insulin, or can't use it; insulin moves glucose into cells; diet and tablets aren't enough).",
      "Explain the injection steps (remove cap, clean site — abdomen, buttock or thigh — insert needle, press button, remove and dispose). Reassure if anxious.",
      "Emphasise sterile needles and safe disposal.",
    ],
    words: "insulin / glucose / injection site / abdomen / thigh / sterile / sharps container",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、キャンベルさん。地域保健センターの医師の[名前]です。今日はインスリン注射のやり方を一緒に練習しに来ました。", en: "Hello, Mrs Campbell. I'm Dr [Name] from the community health centre. I've come today to go through how to give your insulin injections." },
      { s: "問診", t: 1, jp: "始める前に、インスリンを始めることについてどう感じていらっしゃるか伺ってもいいですか？", en: "Before we start, can I ask how you feel about starting insulin?" },
      { s: "共感", t: 1, jp: "食事と飲み薬でずっと頑張ってこられたのに、注射と言われると戸惑いますよね。", en: "You've worked really hard with your diet and tablets, so I can understand why this feels like a surprise." },
      { s: "説明", t: 2, jp: "糖尿病では、インスリンが足りないか、うまく働きません。インスリンは血液中の糖を細胞に運んでエネルギーにする役目があります。今は食事と飲み薬だけでは血糖を抑えきれなくなっています。", en: "In diabetes, the body either doesn't make enough insulin or can't use it properly. Insulin moves sugar from your blood into your cells for energy. At the moment, diet and tablets alone aren't keeping your sugar under control." },
      { s: "説明", t: 3, jp: "まずキャップを外し、お腹・お尻・太ももなど打つ場所を消毒します。針を皮膚に刺してボタンを押し、針を抜いて捨てます。", en: "First, take the cap off and clean the injection site — your tummy, bottom or thigh. Then put the needle into the skin, press the button, and remove the needle and throw it away." },
      { s: "安心", t: 3, jp: "最初は不安かもしれませんが、とても簡単で、数回で慣れますよ。", en: "It may feel daunting at first, but it's really very simple, and most people get used to it within a few goes." },
      { s: "提案", t: 4, jp: "針は毎回新しい清潔なものを使い、使った針は専用の容器に捨ててください。感染やけがを防ぐためです。", en: "Please use a new, sterile needle every time, and put used needles in a special sharps container — that prevents infection and injury." },
      { s: "締め", t: 0, jp: "まとめますと、血糖を抑えるためにインスリンが必要になりました。していただきたいのは、今日練習したとおりに毎日注射することです。来週もう一度伺って、一緒に確認しましょう。もし震え、汗、ふらつき、混乱が出たら低血糖のサインなので、すぐに甘いものをとって、私たちに連絡してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — you now need insulin to keep your sugar under control, and what I'd like you to do is give your injection each day, just as we practised. I'll visit again next week to check how you're getting on. If you feel shaky, sweaty, dizzy or confused, that may be low blood sugar — have something sugary straight away and give us a call. Do you have any other questions before we finish?" },
    ] },

  { id: "10", title: "睡眠時無呼吸とCPAP", setting: "General practitioner clinic",
    brief: "Mr Edmond Whitely, 43, started snoring after a nose injury in a car accident six months ago.",
    tasks: [
      "Find out his concerns.",
      "Explain sleep apnoea (airway narrows or blocks in sleep; likely from the nose injury; daytime tiredness, poor concentration, falling asleep).",
      "Explain how a CPAP mask works (steady air pressure keeps the airway open).",
      "Explain how to use it (fit over nose and mouth, connect to the machine, switch on).",
      "Ask him to limit or stop alcohol.",
    ],
    words: "sleep apnoea / airway / CPAP / continuous positive airway pressure / mask",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、ホワイトリーさん。[名前]です。事故で鼻をけがされてから、いびきをかくようになったと伺いました。", en: "Hello, Mr Whitely, I'm Dr [Name]. I understand you've started snoring since you injured your nose in the accident." },
      { s: "問診", t: 1, jp: "いちばん気になっていることは何ですか？ 日中の眠気や疲れはありますか？", en: "What's concerning you most about this? Do you feel tired or sleepy during the day?" },
      { s: "説明", t: 2, jp: "睡眠時無呼吸症候群の可能性が高いです。眠っている間に空気の通り道が狭くなったりふさがったりして、呼吸が短い間止まってしまう状態です。", en: "It sounds like you have sleep apnoea. That's when your airway becomes narrowed or blocked while you sleep, so your breathing stops for short periods.", n: "前回 CPAP を \"sleep apnea\" と3回取り違えた。病名と機械名を分けて言う。" },
      { s: "説明", t: 2, jp: "鼻のけがが原因と考えられます。日中の疲れや集中力の低下、居眠りにつながるので、治療が必要です。", en: "It's most likely caused by the injury to your nose. It can make you tired, affect your concentration, and even make you fall asleep during the day, so it does need treating." },
      { s: "説明", t: 3, jp: "CPAPという機械を使います。眠っている間、マスクから一定の圧で空気を送り、気道を開いたままにします。", en: "The treatment is a CPAP machine. It gives a steady flow of air through a mask while you sleep, which keeps your airway open." },
      { s: "説明", t: 4, jp: "マスクを鼻と口に着けて、チューブで機械につなぎ、スイッチを入れるだけです。", en: "You simply fit the mask over your nose and mouth, connect it to the machine, and switch it on." },
      { s: "提案", t: 5, jp: "お酒は喉の筋肉をゆるめて症状を悪化させるので、量を控えるか、できればやめてください。", en: "Alcohol relaxes the muscles in your throat and makes this worse, so I'd advise cutting down, or ideally stopping altogether." },
      { s: "締め", t: 0, jp: "まとめますと、鼻のけがによる睡眠時無呼吸症候群です。していただきたいのは、毎晩CPAPを使い、お酒を控えることです。1か月後に見直しましょう。もし運転中に眠気を感じたら運転をやめ、胸の痛みや強い息苦しさがあればすぐに受診してください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — you have sleep apnoea, most likely from your nose injury, and what I'd like you to do is use the CPAP machine every night and cut down on alcohol. Let's review this in a month. If you feel sleepy while driving, please stop driving, and if you get chest pain or severe breathlessness, come in straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "11", title: "切迫性尿失禁", setting: "Hospital outpatient clinic",
    brief: "Mrs Heather Calder, 73, has come for a check-up and looks embarrassed to talk.",
    tasks: [
      "Find out about her condition; be empathetic if she is embarrassed.",
      "Ask how she has been coping so far.",
      "Describe the preliminary diagnosis: urge incontinence (overactive bladder; sudden, strong need to urinate).",
      "Explain it is very common in older people, especially women who have given birth (weaker muscles with age).",
      "Assure her it can be controlled (Kegel exercises, bladder training, medication).",
      "Ask what she wants to do next (urologist appointment, pads or disposable underwear).",
    ],
    words: "urge incontinence / overactive bladder / Kegel exercises / bladder training / urologist / pads",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、カルダーさん。[名前]です。今日はどのようなことでいらっしゃいましたか？ ゆっくりで大丈夫ですよ。", en: "Hello, Mrs Calder, I'm Dr [Name]. What's brought you in today? Take your time." },
      { s: "共感", t: 1, jp: "お話ししにくいことですよね。でも思っているよりずっとよくあることですし、来てくださって本当によかったです。", en: "I can see this isn't easy to talk about — it's much more common than you might think, and you did the right thing coming in.", n: "前回 \"That's very embarrassing\" と負の感情語を反射した。" },
      { s: "問診", t: 1, jp: "どんなときに漏れてしまいますか？ 急に強い尿意が来て、トイレに間に合わない感じですか？", en: "Can you tell me when the leaking happens? Is it a sudden, strong urge, and you can't get to the toilet in time?" },
      { s: "問診", t: 2, jp: "これまで、どうやってやりくりされてきましたか？", en: "How have you been managing with this so far?" },
      { s: "説明", t: [3, 4], jp: "これは切迫性尿失禁、いわゆる過活動膀胱です。急に強い尿意が来る状態です。年齢とともに骨盤の筋肉が弱くなるので、特に出産経験のある高齢の女性にとても多いんです。", en: "This is called urge incontinence, or an overactive bladder — it causes a sudden, strong need to pass urine. It's very common in older women, especially those who've had children, because the pelvic muscles get weaker with age.", n: "Task3（診断）とTask4（頻度）を1回で。" },
      { s: "安心", t: 5, jp: "はい、十分コントロールできます。ケーゲル体操という骨盤底筋の運動、膀胱訓練、必要ならお薬で良くなります。", en: "Yes — it can be very well controlled with pelvic floor exercises called Kegel exercises, bladder training and, if needed, medication." },
      { s: "提案", t: 6, jp: "泌尿器科の予約をお取りしましょうか？ それとも当面、パッドがあると助かりますか？", en: "Would you like me to refer you to a urologist, or would some pads help in the meantime?" },
      { s: "締め", t: 0, jp: "まとめますと、過活動膀胱です。していただきたいのは、毎日ケーゲル体操と膀胱訓練をすることです。6週間後に見直しましょう。もし排尿時の痛みや焼ける感じ、尿に血が混じったら、すぐに来てください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — you have an overactive bladder, and what I'd like you to do is start the Kegel exercises and bladder training every day. Let's review this in six weeks. If you notice pain or burning when you pass urine, or blood in your urine, please come back straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "12", title: "壊血病（15歳）", setting: "General practitioner's clinic",
    brief: "Ken, 15, comes in about bruises on his legs and red spots all over his body.",
    tasks: [
      "Ask about his concerns and what he has done so far.",
      "Explain the diagnosis, scurvy (lack of vitamin C; bleeding gums, easy bruising, tiredness, rashes) and why vitamin C matters (growth and tissue repair).",
      "Encourage fruit and vegetables (especially citrus and leafy salads).",
      "Ask him to come back for review in one week.",
    ],
    words: "scurvy / vitamin C / bruising / bleeding gums / citrus fruits / absorb",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、ケン君。[名前]です。足のあざと体の赤い点のことで来たんだね。", en: "Hi Ken, I'm Dr [Name]. I understand you've come in about the bruises on your legs and the red spots on your body." },
      { s: "問診", t: 1, jp: "いちばん心配なのはどんなこと？ これまでに何か自分でやってみたことはある？", en: "What's worrying you most about it? And have you tried anything to deal with it so far?" },
      { s: "問診", t: 1, jp: "普段どんなものを食べている？ 果物や野菜はよく食べるかな？", en: "What do you usually eat? Do you have much fruit or vegetables?" },
      { s: "説明", t: 2, jp: "壊血病という病気だと思います。ビタミンCが足りないと起こり、歯ぐきからの出血、あざができやすい、疲れやすい、発疹などが出ます。", en: "I think this is a condition called scurvy. It happens when you don't get enough vitamin C, and it causes bleeding gums, easy bruising, tiredness and rashes.", n: "前回 scurvy を \"scabies\" と2回取り違えた。紙に書く。" },
      { s: "説明", t: 2, jp: "ビタミンCは、成長や体の組織の修復など、体のいろいろな働きに欠かせません。", en: "Vitamin C is really important for lots of things in the body, including growth and repairing tissue." },
      { s: "提案", t: 3, jp: "オレンジなどの柑橘類や葉物野菜のサラダをたくさん食べてね。ビタミンCと、その吸収を助ける他のビタミンもとれるよ。", en: "I'd like you to eat plenty of fruit and vegetables — especially citrus fruits like oranges, and green leafy salads. They contain vitamin C, plus other vitamins that help your body absorb it." },
      { s: "締め", t: 4, jp: "まとめると、ビタミンC不足による壊血病です。してほしいのは、毎日果物と野菜をしっかり食べることです。1週間後にもう一度診せてね。もし歯ぐきの出血が止まらない、あざが増える、とても疲れるようなら、それより早く来てください。終わる前に、何か他に質問はある？", en: "So, to summarise — this is scurvy, caused by a lack of vitamin C, and what I'd like you to do is eat plenty of fruit and vegetables every day. Let's review you in one week. If your gums keep bleeding, the bruises get worse, or you feel very tired, please come back sooner. Do you have any other questions before we finish?", n: "RP12は11本中最良の締めだったが safety net と最終質問が欠落。" },
    ] },

  { id: "13", title: "片頭痛・怒る夫", setting: "Emergency department",
    brief: "The patient's husband is frustrated and thinks his wife isn't being cared for. She has a severe migraine and has already had strong painkillers. You closed her door to keep her calm, which may have confused him.",
    tasks: [
      "Calm the husband: empathise and reassure him she is getting appropriate treatment.",
      "Find out his concerns.",
      "Explain she has a migraine only, with no other serious disease.",
      "Explain why no more painkillers can be given (already had strong ones; side effects; wait about 30 minutes).",
      "Explain the door was closed to keep the room dark and quiet (light and noise worsen migraine).",
    ],
    words: "migraine / painkillers / side effects / thirty minutes / dark and quiet",
    steps: [
      { s: "導入", t: 0, jp: "こんにちは、アニーさんの担当医の[名前]です。ご主人でいらっしゃいますね。", en: "Hello, I'm Dr [Name], the doctor looking after Annie. You must be her husband." },
      { s: "共感", t: 1, jp: "長くお待たせして本当に申し訳ありません。お怒りになるのはもっともですし、そうお感じになる権利があります。", en: "I'm so sorry you've had such a long wait. I can see why you're upset, and you have every right to be.", n: "怒りを先に承認する。統計や説明から入らない（RP21の失点）。" },
      { s: "安心", t: 1, jp: "奥さまには適切な治療をしっかり行っていますので、ご安心ください。", en: "I want to reassure you that your wife is getting the right treatment." },
      { s: "問診", t: 2, jp: "今いちばん気がかりなのは何か、伺ってもいいですか？", en: "Can I ask what's worrying you most right now?" },
      { s: "安心", t: 3, jp: "奥さまは重い片頭痛です。それ以上に深刻な病気の兆候はありません。", en: "Your wife has a severe migraine — there's no sign of anything more serious." },
      { s: "説明", t: 4, jp: "今これ以上痛み止めを出せないのは、すでに強い痛み止めを使っていて、さらに増やすと副作用で危険だからです。30分ほどで効いてくるはずです。", en: "The reason I can't give her more painkillers just now is that we've already given her a strong dose, and more could cause harmful side effects. It should start working within about thirty minutes.", n: "1-B：断るときは必ず理由をつける。" },
      { s: "説明", t: 5, jp: "どうぞ奥さまのそばにいてください。ドアを閉めたのは、光と音で片頭痛が悪化するので、部屋を暗く静かにするためです。", en: "You're very welcome to stay with her — we closed the door to keep the room dark and quiet, because light and noise can make a migraine worse.", n: "前回 \"Please don't disturb her\" と言ってしまった。歓迎→理由の順。" },
      { s: "締め", t: 0, jp: "まとめますと、アニーさんは重い片頭痛で、すでに強い痛み止めを使っていて30分ほどで効くはずです。30分後にまた様子を見に来ます。もし痛みがさらに強くなったり、手足の力が入らない、混乱している、吐くといった様子があれば、すぐに看護師を呼んでください。終わる前に、何か他にご質問はありますか？", en: "So, to summarise — Annie has a severe migraine, and she's already had strong pain relief, which should work within thirty minutes. I'll come back and check on her in half an hour. If her pain gets worse, or she has any weakness, confusion or vomiting, please call a nurse straight away. Do you have any other questions before we finish?" },
    ] },

  { id: "14", title: "小児脳腫瘍の告知", setting: "Surgical ward",
    brief: "Mr Richard Parker is the single father of Fiona, 5, admitted last night with a week of headaches and vomiting. An MRI shows a tumour at the back of her brain; surgery is planned. You must break the news. He is shocked and distressed.",
    tasks: [
      "Explain the diagnosis: brain tumour needing surgery; the surgery is safe and she will be sedated.",
      "Assure him the tumour is benign (won't spread) and unlikely to recur.",
      "Reassure him she should recover completely.",
      "Explain the need for follow-up after discharge (to confirm complete removal).",
      "Suggest physio, speech or occupational therapy to speed recovery.",
      "Address his self-blame (not his fault) and offer help finding a carers' support group.",
    ],
    words: "tumour / benign / sedated / follow-up / speech therapy / occupational therapy / support group",
    steps: [
      { s: "導入", t: 0, jp: "パーカーさん、フィオナちゃんを担当している医師の[名前]です。どうぞおかけください。", en: "Mr Parker, I'm Dr [Name], one of the doctors looking after Fiona. Please, have a seat." },
      { s: "説明", t: 1, jp: "パーカーさん、残念ながらMRIで大切なお話をしなければならないことが見つかりました。今お話ししてもよろしいですか？", en: "Mr Parker, I'm afraid the MRI scan has shown something serious that we need to talk about. Is now a good time?", n: "前回は警告射撃なしで即告知。" },
      { s: "説明", t: 2, jp: "MRIで、フィオナちゃんの脳の後ろ側に腫瘍が見つかりました。良い知らせは、それが良性だということです。つまり体の他の部分に広がることはありません。", en: "The scan has shown a tumour at the back of Fiona's brain. The good news is that it's benign — that means it won't spread to other parts of her body." },
      { s: "共感", t: 0, jp: "ちょっとしたことだと思っていらしたのに、大変なショックですよね。ゆっくりで大丈夫です。", en: "I can see this has come as a huge shock — you were expecting something minor. Take your time.", n: "前回は告知直後に \"It's very rare to find a brain tumor\"。沈黙を待つ。" },
      { s: "説明", t: [1, 3], jp: "手術はとても安全で、フィオナちゃんは眠っている間に終わるので痛みはありません。完全に回復すると考えています。", en: "The surgery is very safe, and Fiona will be asleep the whole time, so she won't feel any pain. We expect her to recover completely.", n: "Task1（安全・鎮静）とTask3（完全回復）を1回で。" },
      { s: "安心", t: 2, jp: "再発する可能性も低いと考えています。", en: "It's also very unlikely to come back." },
      { s: "説明", t: 4, jp: "退院後も、腫瘍がすべて取れたかを確認するため、定期的に外来で診せていただきます。", en: "After she goes home, we'll see her regularly in clinic to make sure the tumour has been completely removed." },
      { s: "提案", t: 5, jp: "回復を早めるために、必要に応じて理学療法、言語療法、作業療法もご用意できます。", en: "If she needs it, we can also arrange physiotherapy, speech therapy or occupational therapy to help her recover faster." },
